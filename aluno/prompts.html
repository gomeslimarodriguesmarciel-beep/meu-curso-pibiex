<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIBIEX Digital · Banco de Prompts</title>
    <link rel="stylesheet" href="/tailwind.css">
    <link rel="stylesheet" href="/pibiex-ui.css">
    <script src="/acessibilidade.js"></script>
    <script src="/painel-listas.js"></script>
    <link rel="stylesheet" href="/fonts/inter.css">
    <script src="/vendor/supabase/supabase.js"></script>
    <script src="/simulacao.js"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="flex min-h-screen">

    <div id="sidebar-container"></div>

    <div class="flex-1 min-w-0">
        <div id="topo-pagina"></div>

        <main class="p-4 md:p-9 max-w-5xl mx-auto">
            <h1 class="fonte-display text-2xl font-semibold mb-1" style="color: var(--pibiex-texto);">Banco de Prompts</h1>
            <p class="text-sm mb-6" style="color: var(--pibiex-texto-suave);">Prompts prontos, organizados por categoria. Copie e adapte para sua necessidade.</p>

            <input id="busca-prompt" type="search" class="caixa-busca mb-4" placeholder="Buscar prompt pelo título ou texto" aria-label="Buscar prompt" autocomplete="off">
            <div id="filtros" class="mb-6"></div>
            <div id="lista-prompts" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="skel" role="status" aria-label="Carregando"><i></i><i></i><i></i></div>
            </div>
        </main>
    </div>

    <div id="assistente-flutuante"></div>

    <script src="shell.js"></script>
    <script>
        function escaparHtml(texto) {
            const div = document.createElement('div');
            div.innerText = texto ?? '';
            return div.innerHTML;
        }

        let TODOS_PROMPTS = [];
        let CATEGORIA_ATIVA = 'Todas';

        const L = window.PibiexLista;

        function renderizarFiltros() {
            const termo = document.getElementById('busca-prompt').value.trim().toLowerCase();
            const base = TODOS_PROMPTS.filter((p) => !termo || (p.titulo || '').toLowerCase().includes(termo) || (p.conteudo || '').toLowerCase().includes(termo));
            const categorias = [...new Set(TODOS_PROMPTS.map((p) => p.categoria))];
            if (CATEGORIA_ATIVA !== 'Todas' && !categorias.includes(CATEGORIA_ATIVA)) CATEGORIA_ATIVA = 'Todas';
            L.abas(document.getElementById('filtros'), [{ id: 'Todas', rotulo: 'Todas', n: base.length }]
                .concat(categorias.map((c) => ({ id: c, rotulo: c, n: base.filter((p) => p.categoria === c).length }))),
                CATEGORIA_ATIVA, (id) => { CATEGORIA_ATIVA = id; renderizarFiltros(); renderizarPrompts(); });
        }

        function renderizarPrompts() {
            const container = document.getElementById('lista-prompts');
            const termo = document.getElementById('busca-prompt').value.trim().toLowerCase();
            const filtrados = TODOS_PROMPTS
                .filter((p) => CATEGORIA_ATIVA === 'Todas' || p.categoria === CATEGORIA_ATIVA)
                .filter((p) => !termo || (p.titulo || '').toLowerCase().includes(termo) || (p.conteudo || '').toLowerCase().includes(termo));

            if (filtrados.length === 0) {
                container.innerHTML = `<div class="vazio-lista md:col-span-2"><b>Nenhum prompt encontrado</b>Mude a busca ou a categoria.</div>`;
                return;
            }

            container.innerHTML = filtrados.map((p) => `
                <div class="bg-white rounded-lg p-4 border flex flex-col gap-2" style="border-color: var(--pibiex-borda);">
                    <div class="flex items-center justify-between gap-2">
                        <p class="font-semibold text-[14px]" style="color: var(--pibiex-texto);">${escaparHtml(p.titulo)}</p>
                        <span class="chip azul shrink-0">${escaparHtml(p.categoria)}</span>
                    </div>
                    <p class="text-xs whitespace-pre-wrap font-mono p-2.5 rounded-md" style="background: var(--pibiex-papel); color: var(--pibiex-texto);">${escaparHtml(p.conteudo)}</p>
                    <button type="button" data-copiar="${escaparHtml(p.id)}"
                            class="text-xs font-semibold self-start px-3 py-1.5 rounded-full" style="background: var(--pibiex-tinta); color: white;">
                        Copiar
                    </button>
                </div>
            `).join('');

            container.querySelectorAll('[data-copiar]').forEach((b) => {
                b.onclick = async () => {
                    const item = TODOS_PROMPTS.find((x) => x.id === b.dataset.copiar);
                    if (!item) return;
                    try { await navigator.clipboard.writeText(item.conteudo); b.innerText = 'Copiado!'; }
                    catch (e) { b.innerText = 'Não foi possível copiar'; }
                    setTimeout(() => { b.innerText = 'Copiar'; }, 1500);
                };
            });
        }

        document.getElementById('busca-prompt').addEventListener('input', () => { renderizarFiltros(); renderizarPrompts(); });

        async function carregar() {
            const { data, error } = await window.supabaseClient
                .from('prompts')
                .select('id, titulo, categoria, conteudo')
                .eq('publico', true)
                .order('categoria', { ascending: true });

            if (error) {
                document.getElementById('lista-prompts').innerHTML =
                    `<p class="text-sm text-red-600 bg-white rounded-lg p-5 border border-red-100 col-span-2">Não foi possível carregar os prompts.</p>`;
                console.error(error);
                return;
            }

            TODOS_PROMPTS = data || [];
            renderizarFiltros();
            renderizarPrompts();
        }

        iniciarShellAluno('prompts').then((dados) => {
            if (dados) carregar();
        });
    </script>
</body>
</html>
