<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIBIEX 2026 · Alunos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }</style>
</head>
<body class="flex min-h-screen bg-gray-50">

    <div id="sidebar-container"></div>

    <div class="flex-1 min-w-0">
        <div id="topo-pagina"></div>

        <main class="p-8 max-w-5xl mx-auto">
            <div class="flex items-center justify-between mb-6">
                <div>
                    <h1 class="text-2xl font-black text-gray-900">Alunos</h1>
                    <p class="text-sm text-gray-500">Cadastre novos alunos e veja quem já está na turma.</p>
                </div>
                <button onclick="abrirModalCadastro()" class="bg-red-600 text-white font-bold text-sm px-5 py-2.5 rounded-xl hover:bg-red-700 transition shadow-sm">
                    + Cadastrar aluno
                </button>
            </div>

            <div id="lista-alunos" class="bg-white rounded-xl border border-gray-100 divide-y divide-gray-100">
                <p class="text-sm text-gray-400 p-5">Carregando...</p>
            </div>
        </main>
    </div>

    <!-- ================= MODAL: CADASTRAR ALUNO ================= -->
    <div id="modal-cadastro" class="fixed inset-0 z-50 hidden bg-gray-900/70 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-7 relative">
            <button onclick="fecharModalCadastro()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-900 font-bold text-lg">✖</button>
            <h2 class="text-xl font-black text-gray-900 mb-1">Cadastrar novo aluno</h2>
            <p class="text-sm text-gray-500 mb-6">O sistema gera uma senha provisória e envia por e-mail automaticamente.</p>

            <form id="form-cadastro" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1 uppercase tracking-wide">Nome completo</label>
                    <input type="text" id="novo-nome" required class="w-full border border-gray-200 rounded-lg p-3 bg-gray-50 focus:ring-2 focus:ring-red-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1 uppercase tracking-wide">Data de nascimento</label>
                    <input type="date" id="novo-nascimento" required class="w-full border border-gray-200 rounded-lg p-3 bg-gray-50 focus:ring-2 focus:ring-red-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1 uppercase tracking-wide">Nome de usuário</label>
                    <input type="text" id="novo-usuario" required placeholder="ex: joao.silva" class="w-full border border-gray-200 rounded-lg p-3 bg-gray-50 focus:ring-2 focus:ring-red-500 outline-none">
                    <p class="text-[11px] text-gray-400 mt-1">O e-mail de acesso será gerado automaticamente como <span class="font-mono">usuario@pibiex.com</span>.</p>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1 uppercase tracking-wide">Turma</label>
                    <select id="novo-turma" class="w-full border border-gray-200 rounded-lg p-3 bg-gray-50 focus:ring-2 focus:ring-red-500 outline-none"></select>
                </div>

                <p id="msg-cadastro" class="hidden text-sm font-semibold p-3 rounded-lg"></p>

                <button type="submit" id="btn-cadastrar" class="w-full bg-red-600 text-white font-bold py-3 rounded-xl hover:bg-red-700 transition shadow-lg">
                    Cadastrar e enviar acesso
                </button>
            </form>
        </div>
    </div>

    <script src="shell.js"></script>
    <script>
        let TOKEN_EQUIPE = null;
        let TURMAS = [];

        function formatarData(dataIso) {
            if (!dataIso) return '—';
            return new Date(dataIso).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
        }

        function renderizarTurmasNoSelect() {
            const select = document.getElementById('novo-turma');
            select.innerHTML = TURMAS.map(t => `<option value="${t.id}">${t.nome}</option>`).join('');
        }

        function renderizarAlunos(alunos) {
            const container = document.getElementById('lista-alunos');

            if (!alunos || alunos.length === 0) {
                container.innerHTML = `<p class="text-sm text-gray-400 p-5">Nenhum aluno cadastrado ainda.</p>`;
                return;
            }

            container.innerHTML = alunos.map(a => `
                <div class="flex items-center justify-between p-4">
                    <div>
                        <p class="text-sm font-bold text-gray-800">${a.nome_completo}</p>
                        <p class="text-xs text-gray-500">
                            <span class="font-mono">${a.usuario}</span> · ${a.email} ${a.turmaNome ? `· ${a.turmaNome}` : ''}
                        </p>
                    </div>
                    <div class="text-right shrink-0">
                        ${a.precisa_trocar_senha
                            ? `<span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded-full bg-amber-50 text-amber-700">Aguardando 1º acesso</span>`
                            : `<span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded-full bg-green-50 text-green-700">Ativo</span>`}
                        <p class="text-[11px] text-gray-400 mt-1">Desde ${formatarData(a.criado_em)}</p>
                    </div>
                </div>
            `).join('');
        }

        window.abrirModalCadastro = () => {
            document.getElementById('modal-cadastro').classList.remove('hidden');
        };
        window.fecharModalCadastro = () => {
            document.getElementById('modal-cadastro').classList.add('hidden');
            document.getElementById('msg-cadastro').classList.add('hidden');
        };

        document.getElementById('form-cadastro').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('msg-cadastro');
            const btn = document.getElementById('btn-cadastrar');
            msg.classList.add('hidden');

            const nomeCompleto = document.getElementById('novo-nome').value.trim();
            const dataNascimento = document.getElementById('novo-nascimento').value;
            const usuario = document.getElementById('novo-usuario').value.trim();
            const turmaId = document.getElementById('novo-turma').value;

            btn.innerText = 'Cadastrando...';
            btn.disabled = true;

            const { data, error } = await window.supabaseClient.functions.invoke('cadastrar-aluno', {
                body: { tokenEquipe: TOKEN_EQUIPE, acao: 'cadastrar', nomeCompleto, dataNascimento, usuario, turmaId },
            });

            btn.innerText = 'Cadastrar e enviar acesso';
            btn.disabled = false;

            if (error || !data || data.erro) {
                msg.innerText = (data && data.erro) || 'Erro ao cadastrar. Tente novamente.';
                msg.className = 'text-sm font-semibold p-3 rounded-lg bg-red-50 text-red-600';
                msg.classList.remove('hidden');
                return;
            }

            if (data.aviso) {
                msg.innerText = data.aviso;
                msg.className = 'text-sm font-semibold p-3 rounded-lg bg-amber-50 text-amber-700';
                msg.classList.remove('hidden');
            } else {
                document.getElementById('form-cadastro').reset();
                fecharModalCadastro();
            }

            await carregarAlunos();
        });

        async function carregarAlunos() {
            const { data, error } = await window.supabaseClient.functions.invoke('cadastrar-aluno', {
                body: { tokenEquipe: TOKEN_EQUIPE, acao: 'listar' },
            });

            if (error || !data || data.erro) {
                document.getElementById('lista-alunos').innerHTML =
                    `<p class="text-sm text-red-600 p-5">Não foi possível carregar os alunos.</p>`;
                return;
            }

            TURMAS = data.turmas || [];
            renderizarTurmasNoSelect();
            renderizarAlunos(data.alunos);
        }

        iniciarShellEquipe('alunos').then((sessao) => {
            if (!sessao) return;
            TOKEN_EQUIPE = sessao.token;
            carregarAlunos();
        });
    </script>
</body>
</html>
