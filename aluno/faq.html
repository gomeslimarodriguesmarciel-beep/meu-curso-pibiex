<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIBIEX Digital · FAQ</title>
    <link rel="stylesheet" href="/tailwind.css">
    <link rel="stylesheet" href="/pibiex-ui.css">
    <script src="/acessibilidade.js"></script>
    <link rel="stylesheet" href="/fonts/inter.css">
    <script src="/vendor/supabase/supabase.js"></script>
    <script src="/simulacao.js"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="flex min-h-screen">

    <div id="sidebar-container"></div>

    <div class="flex-1 min-w-0">
        <div id="topo-pagina"></div>

        <main class="p-4 md:p-9 max-w-3xl mx-auto">
            <h1 class="fonte-display text-2xl font-semibold mb-1" style="color: var(--pibiex-texto);">Perguntas Frequentes</h1>
            <p class="text-sm mb-7" style="color: var(--pibiex-texto-suave);">Respostas rápidas para as dúvidas mais comuns sobre IA.</p>

            <input id="busca-faq" type="search" class="caixa-busca mb-4" placeholder="Buscar nas perguntas e respostas" aria-label="Buscar nas perguntas e respostas" autocomplete="off">
            <div id="lista-faq" class="space-y-3">
                <div class="skel" role="status" aria-label="Carregando"><i></i><i></i><i></i></div>
            </div>
        </main>
    </div>

    <div id="assistente-flutuante"></div>

    <script src="shell.js"></script>
    <script>
        function escaparHtml(texto) {
            const div = document.createElement('div');
            div.innerText = texto ?? '';
            return div.innerHTML;
        }

        let FAQS = [];
        function renderizar(faqs) {
            if (faqs) FAQS = faqs;
            const termo = document.getElementById('busca-faq').value.trim().toLowerCase();
            const container = document.getElementById('lista-faq');
            const total = FAQS.length;
            faqs = FAQS.filter((f) => !termo || (f.pergunta || '').toLowerCase().includes(termo) || (f.resposta || '').toLowerCase().includes(termo));
            if (total && faqs.length === 0) {
                container.innerHTML = '<div class="vazio-lista"><b>Nenhuma pergunta encontrada</b>Tente outras palavras.</div>';
                return;
            }

            if (!faqs || faqs.length === 0) {
                container.innerHTML = `<p class="text-sm bg-white rounded-lg p-5 border" style="color: var(--pibiex-texto-suave); border-color: var(--pibiex-borda);">Nenhuma pergunta cadastrada ainda.</p>`;
                return;
            }

            container.innerHTML = faqs.map((item, i) => `
                <details class="bg-white rounded-lg border group" style="border-color: var(--pibiex-borda);">
                    <summary class="px-5 py-4 font-semibold text-[14.5px] cursor-pointer list-none flex items-center justify-between" style="color: var(--pibiex-texto);">
                        ${escaparHtml(item.pergunta)}
                        <span class="text-lg group-open:rotate-45 transition" style="color: var(--pibiex-dourado-profundo);">+</span>
                    </summary>
                    <p class="px-5 pb-4 text-sm" style="color: var(--pibiex-texto-suave);">${escaparHtml(item.resposta)}</p>
                </details>
            `).join('');
        }

        async function carregar() {
            const { data, error } = await window.supabaseClient
                .from('faq')
                .select('pergunta, resposta, categoria, ordem')
                .eq('ativo', true)
                .order('ordem', { ascending: true });

            if (error) {
                document.getElementById('lista-faq').innerHTML =
                    `<p class="text-sm text-red-600 bg-white rounded-lg p-5 border border-red-100">Não foi possível carregar o FAQ.</p>`;
                console.error(error);
                return;
            }
            renderizar(data);
        }
        document.getElementById('busca-faq').addEventListener('input', () => renderizar());

        iniciarShellAluno('faq').then((dados) => {
            if (dados) carregar();
        });
    </script>
</body>
</html>
