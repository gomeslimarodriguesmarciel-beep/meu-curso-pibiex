<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIBIEX Digital · Galeria</title>
    <link rel="stylesheet" href="/tailwind.css">
    <link rel="stylesheet" href="/pibiex-ui.css">
    <script src="/acessibilidade.js"></script>
    <script src="/painel-listas.js"></script>
    <link rel="stylesheet" href="/fonts/inter.css">
    <script src="/vendor/supabase/supabase.js"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="flex min-h-screen bg-gray-50">

    <div id="sidebar-container"></div>

    <div class="flex-1 min-w-0">
        <div id="topo-pagina"></div>

        <main class="p-4 md:p-8 max-w-4xl mx-auto">
            <h1 class="text-2xl font-black text-gray-800 mb-1">Moderar Galeria</h1>
            <p class="text-gray-500 mb-6">Veja os projetos publicados pelos alunos, comente como equipe e remova conteúdo inadequado.</p>

            <div class="flex flex-wrap items-center gap-3 mb-4">
                <input id="busca-galeria" type="search" class="caixa-busca" style="flex:1;min-width:200px" placeholder="Buscar por título ou autor" aria-label="Buscar projeto por título ou autor" autocomplete="off">
                <select id="ordem-galeria" class="border border-gray-200 rounded-xl px-3 py-2.5 text-sm bg-white" aria-label="Ordenar">
                    <option value="recentes">Mais recentes</option>
                    <option value="curtidos">Mais curtidos</option>
                    <option value="comentados">Mais comentados</option>
                </select>
            </div>
            <div id="abas-galeria" class="mb-4"></div>

            <div id="lista-projetos" class="space-y-3">
                <div class="skel" role="status" aria-label="Carregando"><i></i><i></i><i></i></div>
            </div>
        </main>
    </div>

    <script src="shell.js"></script>
    <script>
        let TOKEN_EQUIPE = null;

        function escaparHtml(texto) {
            const div = document.createElement('div');
            div.innerText = texto ?? '';
            return div.innerHTML;
        }

        function formatarData(dataIso) {
            if (!dataIso) return '';
            return new Date(dataIso).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        async function chamarModerarGaleria(acao, dados) {
            const { data, error } = await window.supabaseClient.functions.invoke('moderar-galeria', {
                body: { tokenEquipe: TOKEN_EQUIPE, acao, ...dados },
            });
            if (error || !data || data.erro) {
                alert((data && data.erro) ? data.erro : 'Erro ao executar a ação. Tente novamente.');
                return null;
            }
            return data;
        }

        async function carregarGaleria() {
            const resultado = await chamarModerarGaleria('listar', {});
            if (!resultado) {
                document.getElementById('lista-projetos').innerHTML = '<p class="text-red-500 text-sm">Erro ao carregar a galeria.</p>';
                return;
            }
            renderizarGaleria(resultado.projetos || []);
        }

        const L = window.PibiexLista;
        let PROJETOS = [];
        let FILTRO = 'todos';          // 'todos' | 'comentarios' | 'semcomentarios'
        const ABERTOS = new Set();

        function renderizarGaleria(projetos) {
            if (projetos) PROJETOS = projetos;
            const container = document.getElementById('lista-projetos');

            if (PROJETOS.length === 0) {
                document.getElementById('abas-galeria').innerHTML = '';
                container.innerHTML = '<div class="vazio-lista"><b>Nenhum projeto publicado ainda</b>Quando os alunos publicarem, aparece aqui para você moderar.</div>';
                return;
            }

            const termo = document.getElementById('busca-galeria').value.trim().toLowerCase();
            const base = PROJETOS.filter((p) => !termo || (p.titulo || '').toLowerCase().includes(termo) || (p.autorNome || '').toLowerCase().includes(termo));
            const nCom = (p) => (p.comentarios || []).length;
            const criterios = { todos: () => true, comentarios: (p) => nCom(p) > 0, semcomentarios: (p) => nCom(p) === 0 };
            const n = (k) => base.filter(criterios[k]).length;
            L.abas(document.getElementById('abas-galeria'), [
                { id: 'todos', rotulo: 'Todos', n: base.length },
                { id: 'comentarios', rotulo: 'Com comentários', n: n('comentarios') },
                { id: 'semcomentarios', rotulo: 'Sem comentários', n: n('semcomentarios') },
            ], FILTRO, (id) => { FILTRO = id; renderizarGaleria(); });

            const ordem = document.getElementById('ordem-galeria').value;
            const lista = base.filter(criterios[FILTRO]).sort((a, b) =>
                ordem === 'curtidos' ? (b.totalCurtidas || 0) - (a.totalCurtidas || 0)
                : ordem === 'comentados' ? nCom(b) - nCom(a)
                : (b.criado_em || '').localeCompare(a.criado_em || ''));

            if (!lista.length) { container.innerHTML = '<div class="vazio-lista"><b>Nenhum projeto encontrado</b>Mude a busca ou o filtro.</div>'; return; }

            container.innerHTML = lista.map((p) => {
                const comentarios = p.comentarios || [];
                const comentariosHtml = comentarios.length === 0
                    ? '<p class="text-xs text-gray-500">Nenhum comentário.</p>'
                    : comentarios.map((c) => `
                        <div class="flex items-start justify-between gap-2">
                            <p class="text-xs text-gray-700">
                                <span class="font-bold ${c.autor_tipo === 'equipe' ? 'text-red-700' : 'text-gray-800'}">${L.esc(c.autorNome)}${c.autor_tipo === 'equipe' ? ' (equipe)' : ''}:</span>
                                ${L.esc(c.comentario)}
                            </p>
                            <button onclick="excluirComentario('${c.id}')" title="Excluir comentário" class="text-gray-400 hover:text-red-600 shrink-0 p-1" aria-label="Excluir comentário">${icone('excluir', 14)}</button>
                        </div>`).join('');

                return `
                    <details class="cx" data-id="${L.esc(p.id)}" ${ABERTOS.has(p.id) ? 'open' : ''}>
                        <summary>
                            <span class="avatar-ini" aria-hidden="true">${L.esc(L.iniciais(p.autorNome))}</span>
                            <span class="min-w-0 flex-1">
                                <span class="cx-titulo block">${L.esc(p.titulo)}</span>
                                <span class="cx-sub block">Por ${L.esc(p.autorNome)} · ${L.esc(L.tempo(p.criado_em))}</span>
                                <span class="flex flex-wrap gap-1.5 mt-2">
                                    <span class="chip cinza">${p.totalCurtidas || 0} ${(p.totalCurtidas || 0) === 1 ? 'curtida' : 'curtidas'}</span>
                                    <span class="chip ${comentarios.length ? 'azul' : 'cinza'}">${comentarios.length} ${comentarios.length === 1 ? 'comentário' : 'comentários'}</span>
                                </span>
                            </span>
                        </summary>
                        <div class="cx-corpo">
                            ${p.descricao ? `<p class="text-sm text-gray-700 whitespace-pre-wrap">${L.esc(p.descricao)}</p>` : '<p class="text-sm text-gray-500">Sem descrição.</p>'}
                            ${p.arquivo_url ? `<p class="mt-2"><a href="${L.esc(/^https?:\/\//i.test(p.arquivo_url) ? p.arquivo_url : '#')}" target="_blank" rel="noopener" class="text-blue-700 text-sm font-semibold hover:underline">Abrir projeto &rarr;</a></p>` : ''}
                            <div class="mt-4 pt-3 border-t border-gray-100 space-y-2">
                                <p class="text-xs font-bold text-gray-500 uppercase">Comentários</p>
                                ${comentariosHtml}
                                <form onsubmit="return comentarProjeto(event, '${p.id}')" class="flex gap-2 pt-1">
                                    <input id="comentario-${p.id}" required placeholder="Comentar como equipe..." aria-label="Comentar como equipe" class="flex-1 border border-gray-200 rounded-lg px-3 py-2 text-sm">
                                    <button type="submit" class="bg-gray-900 text-white text-xs font-bold px-4 py-2 rounded-lg shrink-0">Comentar</button>
                                </form>
                            </div>
                            <div class="mt-4 pt-3 border-t border-gray-100">
                                <button onclick="excluirProjeto('${p.id}')" class="inline-flex items-center gap-1.5 text-red-700 hover:text-red-900 text-sm font-bold px-3 py-2 rounded-lg bg-red-50 hover:bg-red-100">${icone('excluir')} Excluir projeto</button>
                            </div>
                        </div>
                    </details>`;
            }).join('');

            container.querySelectorAll('details.cx').forEach((det) => {
                det.addEventListener('toggle', () => { if (det.open) ABERTOS.add(det.dataset.id); else ABERTOS.delete(det.dataset.id); });
            });
        }
        document.getElementById('busca-galeria').addEventListener('input', () => renderizarGaleria());
        document.getElementById('ordem-galeria').addEventListener('change', () => renderizarGaleria());

        window.comentarProjeto = async (event, projetoId) => {
            event.preventDefault();
            const input = document.getElementById(`comentario-${projetoId}`);
            const comentario = input.value.trim();
            if (!comentario) return false;

            const resultado = await chamarModerarGaleria('comentar', { projetoId, comentario });
            if (resultado) { ABERTOS.add(projetoId); carregarGaleria(); }
            return false;
        };

        window.excluirProjeto = async (projetoId) => {
            if (!(await PibiexA11y.confirmar('Excluir este projeto, com todas as curtidas e comentários? Essa ação não pode ser desfeita.'))) return;
            const resultado = await chamarModerarGaleria('excluir_projeto', { projetoId });
            if (resultado) carregarGaleria();
        };

        window.excluirComentario = async (comentarioId) => {
            if (!(await PibiexA11y.confirmar('Excluir este comentário?'))) return;
            const resultado = await chamarModerarGaleria('excluir_comentario', { comentarioId });
            if (resultado) carregarGaleria();
        };

        iniciarShellEquipe('galeria').then((sessao) => {
            if (!sessao) return;
            TOKEN_EQUIPE = sessao.token;
            carregarGaleria();
        });
    </script>
</body>
</html>
