<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIBIEX 2026 · Minha Frequência</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="flex min-h-screen">

    <div id="sidebar-container"></div>

    <div class="flex-1 min-w-0">
        <div id="topo-pagina"></div>

        <main class="p-4 md:p-9 max-w-3xl mx-auto">
            <h1 class="fonte-display text-2xl font-semibold mb-1" style="color: var(--pibiex-texto);">Minha Frequência</h1>
            <p class="text-sm mb-6" style="color: var(--pibiex-texto-suave);">Toda vez que uma chamada abrir durante a aula, um aviso aparece no topo da tela — registre a presença antes do tempo acabar.</p>

            <div class="bg-white rounded-lg border p-5 mb-6 flex items-center justify-between" style="border-color: var(--pibiex-borda);">
                <div>
                    <p class="text-[11px] font-bold uppercase tracking-wide" style="color: var(--pibiex-texto-suave);">Total de horas registradas</p>
                    <p class="text-3xl font-black" id="total-horas" style="color: var(--pibiex-texto);">—</p>
                </div>
            </div>

            <p class="text-[11px] font-bold uppercase tracking-wide mb-2" style="color: var(--pibiex-texto-suave);">Histórico</p>
            <div id="lista-historico" class="space-y-2">
                <p class="text-sm" style="color: var(--pibiex-texto-suave);">Carregando...</p>
            </div>
        </main>
    </div>

    <div id="assistente-flutuante"></div>

    <script src="shell.js"></script>
    <script>
        let TOKEN_ALUNO = null;

        function formatarDataHora(iso) {
            return new Date(iso).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        function escaparHtml(texto) {
            const div = document.createElement('div');
            div.innerText = texto ?? '';
            return div.innerHTML;
        }

        async function carregar() {
            const { data, error } = await window.supabaseClient.functions.invoke('frequencia', {
                body: { token: TOKEN_ALUNO, acao: 'historico' },
            });

            if (error || !data || data.erro) {
                document.getElementById('lista-historico').innerHTML = `<p class="text-sm text-red-600">Não foi possível carregar sua frequência.</p>`;
                return;
            }

            document.getElementById('total-horas').innerText = `${data.totalHoras}h`;

            const container = document.getElementById('lista-historico');
            if (!data.registros || data.registros.length === 0) {
                container.innerHTML = `<p class="text-sm bg-white rounded-lg p-5 border" style="color: var(--pibiex-texto-suave); border-color: var(--pibiex-borda);">Nenhuma presença registrada ainda.</p>`;
                return;
            }

            container.innerHTML = data.registros.map((r) => `
                <div class="bg-white rounded-lg border p-4 flex items-center justify-between gap-3" style="border-color: var(--pibiex-borda);">
                    <div class="min-w-0">
                        <p class="font-semibold text-[13.5px]" style="color: var(--pibiex-texto);">${escaparHtml(r.titulo || 'Chamada')}</p>
                        <p class="text-[11.5px]" style="color: var(--pibiex-texto-suave);">Registrado em ${formatarDataHora(r.registradoEm)}</p>
                    </div>
                    <span class="text-xs font-bold px-2.5 py-1 rounded-full shrink-0" style="background: var(--pibiex-papel); color: var(--pibiex-tinta);">${r.horas}h</span>
                </div>
            `).join('');
        }

        iniciarShellAluno('frequencia').then((dados) => {
            if (!dados) return;
            TOKEN_ALUNO = localStorage.getItem('pibiex_aluno_token');
            carregar();
        });
    </script>
</body>
</html>
