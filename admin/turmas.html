<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIBIEX Digital · Turmas</title>
    <link rel="stylesheet" href="/tailwind.css">
    <link rel="stylesheet" href="/pibiex-ui.css">
    <script src="/acessibilidade.js"></script>
    <script src="/painel-listas.js"></script>
    <link rel="stylesheet" href="/fonts/inter.css">
    <script src="/vendor/supabase/supabase.js"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="flex min-h-screen bg-gray-50">

    <div id="sidebar-container"></div>

    <div class="flex-1 min-w-0">
        <div id="topo-pagina"></div>

        <main class="p-4 md:p-8 max-w-4xl mx-auto">
            <h1 class="text-2xl font-black text-gray-800 mb-1">Turmas</h1>
            <p class="text-gray-500 mb-6">
                Crie turmas e controle quem tem acesso à plataforma. Ao pausar uma turma, os alunos dela
                param de conseguir entrar até serem movidos para uma turma ativa.
            </p>

            <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
                <div id="abas-turmas"></div>
                <button type="button" id="btn-nova-turma" aria-expanded="false" aria-controls="form-nova" class="bg-gray-900 hover:bg-gray-800 text-white font-bold px-5 py-2.5 rounded-xl text-sm">+ Nova turma</button>
            </div>

            <form id="form-nova" class="hidden bg-white rounded-2xl border border-gray-100 shadow-sm p-5 mb-6">
                <div class="flex flex-wrap gap-3 items-end">
                    <div class="flex-1 min-w-[240px]">
                        <label class="block text-xs font-bold text-gray-500 mb-1">Nome da turma</label>
                        <input id="novo-nome" required placeholder="ex: PIBIEX 2027 · Turma da Manhã"
                               class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">
                    </div>
                    <div class="w-28">
                        <label class="block text-xs font-bold text-gray-500 mb-1">Ano</label>
                        <input id="novo-ano" type="number" min="2020" max="2100"
                               class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">
                    </div>
                    <button type="submit" class="bg-gray-900 hover:bg-gray-800 text-white font-bold px-5 py-2 rounded-lg text-sm">
                        Criar turma
                    </button>
                    <button type="button" id="cancelar-nova-turma" class="text-sm font-bold text-gray-500 hover:text-gray-800 px-3 py-2">Cancelar</button>
                </div>
            </form>

            <div id="lista-turmas" class="space-y-3">
                <div class="skel" role="status" aria-label="Carregando"><i></i><i></i><i></i></div>
            </div>
        </main>
    </div>

    <script src="shell.js"></script>
    <script>
        let TOKEN_EQUIPE = null;
        let idEmEdicao = null;

        function escaparHtml(texto) {
            const div = document.createElement('div');
            div.innerText = texto ?? '';
            return div.innerHTML;
        }

        async function chamarGerenciarTurmas(acao, dados) {
            const { data, error } = await window.supabaseClient.functions.invoke('gerenciar-turmas', {
                body: { tokenEquipe: TOKEN_EQUIPE, acao, ...dados },
            });
            if (error || !data || data.erro) {
                alert((data && data.erro) ? data.erro : 'Erro ao executar a ação. Tente novamente.');
                return null;
            }
            return data;
        }

        async function carregarTurmas() {
            const resultado = await chamarGerenciarTurmas('listar', {});
            if (!resultado) {
                document.getElementById('lista-turmas').innerHTML = '<p class="text-red-500 text-sm">Erro ao carregar as turmas.</p>';
                return;
            }
            renderizarTurmas(resultado.turmas || []);
        }

        function resumoVinculos(v) {
            const partes = [];
            partes.push(`${v.alunos} aluno${v.alunos === 1 ? '' : 's'}`);
            if (v.modulos > 0) partes.push(`${v.modulos} módulo${v.modulos === 1 ? '' : 's'}`);
            if (v.avisos > 0) partes.push(`${v.avisos} aviso${v.avisos === 1 ? '' : 's'}`);
            if (v.mensagens > 0) partes.push(`${v.mensagens} ${v.mensagens === 1 ? 'mensagem' : 'mensagens'}`);
            return partes.join(' · ');
        }

        const L = window.PibiexLista;
        let TURMAS = [];
        let FILTRO = 'todas';          // 'todas' | 'ativas' | 'pausadas'

        function renderizarTurmas(turmas) {
            if (turmas) TURMAS = turmas;
            const container = document.getElementById('lista-turmas');

            if (TURMAS.length === 0) {
                document.getElementById('abas-turmas').innerHTML = '';
                container.innerHTML = '<div class="vazio-lista"><b>Nenhuma turma criada ainda</b>Clique em "+ Nova turma" para criar a primeira.</div>';
                return;
            }

            const ativas = TURMAS.filter((t) => t.ativa).length;
            L.abas(document.getElementById('abas-turmas'), [
                { id: 'todas', rotulo: 'Todas', n: TURMAS.length },
                { id: 'ativas', rotulo: 'Ativas', n: ativas },
                { id: 'pausadas', rotulo: 'Pausadas', n: TURMAS.length - ativas },
            ], FILTRO, (id) => { FILTRO = id; renderizarTurmas(); });

            const lista = TURMAS.filter((t) => FILTRO === 'todas' || (FILTRO === 'ativas' ? t.ativa : !t.ativa));
            if (!lista.length) { container.innerHTML = '<div class="vazio-lista"><b>Nenhuma turma nesta aba</b></div>'; return; }

            container.innerHTML = lista.map((t) => {
                const v = t.vinculos || { alunos: 0, modulos: 0, avisos: 0, mensagens: 0 };
                const vazia = v.alunos === 0 && v.modulos === 0 && v.avisos === 0 && v.mensagens === 0;

                if (idEmEdicao === t.id) {
                    return `
                        <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 space-y-2">
                            <input id="edit-nome-${t.id}" value="${L.esc(t.nome)}" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm font-bold" aria-label="Nome da turma">
                            <div class="flex gap-2 flex-wrap">
                                <input id="edit-ano-${t.id}" type="number" min="2020" max="2100" value="${t.ano ?? ''}" class="w-28 border border-gray-200 rounded-lg px-3 py-2 text-sm" aria-label="Ano">
                                <button onclick="salvarTurma('${t.id}')" class="bg-green-600 text-white text-xs font-bold px-3 py-2 rounded-lg">Salvar</button>
                                <button onclick="cancelarEdicao()" class="bg-gray-200 text-gray-700 text-xs font-bold px-3 py-2 rounded-lg">Cancelar</button>
                            </div>
                        </div>`;
                }

                return `
                    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 ${t.ativa ? '' : 'bg-amber-50/30'}">
                        <div class="flex items-start justify-between gap-4 flex-wrap">
                            <div class="min-w-0">
                                <p class="font-bold text-gray-800 text-sm">${L.esc(t.nome)}</p>
                                <div class="flex flex-wrap gap-1.5 mt-2">
                                    ${t.ativa ? '<span class="chip verde">Ativa</span>' : '<span class="chip ambar">Pausada · alunos sem acesso</span>'}
                                    ${t.ano ? `<span class="chip cinza">${L.esc(t.ano)}</span>` : ''}
                                    <span class="chip ${v.alunos ? 'azul' : 'cinza'}">${v.alunos} ${v.alunos === 1 ? 'aluno' : 'alunos'}</span>
                                    ${v.modulos ? `<span class="chip cinza">${v.modulos} ${v.modulos === 1 ? 'módulo' : 'módulos'}</span>` : ''}
                                    ${v.avisos ? `<span class="chip cinza">${v.avisos} ${v.avisos === 1 ? 'aviso' : 'avisos'}</span>` : ''}
                                    ${v.mensagens ? `<span class="chip cinza">${v.mensagens} ${v.mensagens === 1 ? 'mensagem' : 'mensagens'}</span>` : ''}
                                </div>
                            </div>
                            <div class="flex flex-wrap gap-2 shrink-0">
                                ${t.ativa
                                    ? `<button onclick="pausarTurma('${t.id}')" class="bg-amber-50 hover:bg-amber-100 text-amber-800 text-sm font-bold px-3.5 py-2 rounded-lg">Pausar turma</button>`
                                    : `<button onclick="reativarTurma('${t.id}')" class="bg-green-600 hover:bg-green-700 text-white text-sm font-bold px-3.5 py-2 rounded-lg">Reativar turma</button>`}
                                <button onclick="editarTurma('${t.id}')" class="inline-flex items-center gap-1.5 text-gray-600 hover:text-gray-900 text-sm font-bold px-3 py-2 rounded-lg bg-gray-100 hover:bg-gray-200">${icone('editar')} Renomear</button>
                                <button onclick="excluirTurma('${t.id}')" ${vazia ? '' : 'disabled'} title="${vazia ? 'Excluir turma' : 'Só é possível excluir turma vazia'}"
                                        class="inline-flex items-center gap-1.5 text-sm font-bold px-3 py-2 rounded-lg ${vazia ? 'text-red-700 bg-red-50 hover:bg-red-100' : 'text-gray-400 bg-gray-50 cursor-not-allowed'}">${icone('excluir')} Excluir</button>
                            </div>
                        </div>
                    </div>`;
            }).join('');
        }

        function mostrarFormTurma(mostrar) {
            document.getElementById('form-nova').classList.toggle('hidden', !mostrar);
            document.getElementById('btn-nova-turma').setAttribute('aria-expanded', String(mostrar));
            if (mostrar) document.getElementById('novo-nome').focus();
        }
        document.getElementById('btn-nova-turma').addEventListener('click', () => mostrarFormTurma(document.getElementById('form-nova').classList.contains('hidden')));
        document.getElementById('cancelar-nova-turma').addEventListener('click', () => { document.getElementById('form-nova').reset(); document.getElementById('novo-ano').value = new Date().getFullYear(); mostrarFormTurma(false); });

        document.getElementById('form-nova').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nome = document.getElementById('novo-nome').value.trim();
            const anoBruto = document.getElementById('novo-ano').value;
            const ano = anoBruto ? parseInt(anoBruto, 10) : null;
            if (!nome) return;

            const resultado = await chamarGerenciarTurmas('criar', { nome, ano });
            if (resultado) {
                document.getElementById('form-nova').reset();
                document.getElementById('novo-ano').value = new Date().getFullYear();
                mostrarFormTurma(false);
                carregarTurmas();
            }
        });

        window.editarTurma = (id) => { idEmEdicao = id; carregarTurmas(); };
        window.cancelarEdicao = () => { idEmEdicao = null; carregarTurmas(); };

        window.salvarTurma = async (turmaId) => {
            const nome = document.getElementById(`edit-nome-${turmaId}`).value.trim();
            const anoBruto = document.getElementById(`edit-ano-${turmaId}`).value;
            const ano = anoBruto ? parseInt(anoBruto, 10) : null;
            if (!nome) return;

            const resultado = await chamarGerenciarTurmas('atualizar', { turmaId, nome, ano });
            if (resultado) { idEmEdicao = null; carregarTurmas(); }
        };

        window.pausarTurma = async (turmaId) => {
            if (!(await PibiexA11y.confirmar('Pausar esta turma? Os alunos dela vão perder o acesso à plataforma imediatamente, inclusive quem estiver logado agora.'))) return;
            const resultado = await chamarGerenciarTurmas('pausar', { turmaId });
            if (resultado) carregarTurmas();
        };

        window.reativarTurma = async (turmaId) => {
            const resultado = await chamarGerenciarTurmas('reativar', { turmaId });
            if (resultado) carregarTurmas();
        };

        window.excluirTurma = async (turmaId) => {
            if (!(await PibiexA11y.confirmar('Excluir esta turma? Só funciona se ela estiver vazia.'))) return;
            const resultado = await chamarGerenciarTurmas('excluir', { turmaId });
            if (resultado) carregarTurmas();
        };

        iniciarShellEquipe('turmas').then((sessao) => {
            if (!sessao) return;
            TOKEN_EQUIPE = sessao.token;
            document.getElementById('novo-ano').value = new Date().getFullYear();
            carregarTurmas();
        });
    </script>
</body>
</html>
