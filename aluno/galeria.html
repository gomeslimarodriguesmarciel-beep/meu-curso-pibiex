<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIBIEX 2026 · Galeria</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="flex min-h-screen">

    <div id="sidebar-container"></div>

    <div class="flex-1 min-w-0">
        <div id="topo-pagina"></div>

        <main class="p-4 md:p-9 max-w-3xl mx-auto">
            <h1 class="fonte-display text-2xl font-semibold mb-1" style="color: var(--pibiex-texto);">Galeria dos Alunos</h1>
            <p class="text-sm mb-6" style="color: var(--pibiex-texto-suave);">Compartilhe o que você produziu com IA. Curta e comente os projetos dos colegas.</p>

            <form id="form-postar" class="bg-white rounded-lg p-4 border mb-8 space-y-2" style="border-color: var(--pibiex-borda);">
                <p class="text-[11px] font-bold uppercase tracking-wide mb-1" style="color: var(--pibiex-texto-suave);">Publicar novo projeto</p>
                <input id="novo-titulo" placeholder="Título do projeto" required class="w-full border rounded-md px-3 py-2 text-sm" style="border-color: var(--pibiex-borda);">
                <textarea id="novo-descricao" placeholder="Descreva seu projeto (opcional)" rows="2" class="w-full border rounded-md px-3 py-2 text-sm" style="border-color: var(--pibiex-borda);"></textarea>
                <div class="flex flex-wrap gap-2">
                    <input id="novo-arquivo" type="file" class="flex-1 min-w-[160px] text-sm">
                    <input id="novo-link" type="url" placeholder="Ou cole um link (opcional)" class="flex-1 min-w-[160px] border rounded-md px-3 py-2 text-sm" style="border-color: var(--pibiex-borda);">
                </div>
                <p id="msg-postar" class="text-xs hidden"></p>
                <button type="submit" id="btn-postar" class="text-white text-xs font-semibold px-4 py-2 rounded-md" style="background: var(--pibiex-tinta);">Publicar</button>
            </form>

            <div id="lista-galeria" class="space-y-5">
                <p class="text-sm" style="color: var(--pibiex-texto-suave);">Carregando...</p>
            </div>
        </main>
    </div>

    <div id="assistente-flutuante"></div>

    <script src="shell.js"></script>
    <script>
        let TOKEN_ALUNO = null;

        // Nunca confiar em título/descrição/comentário como HTML pronto — são
        // texto digitado por outro aluno. Sem isso, dava pra publicar um
        // projeto com um <img onerror="..."> no título e rodar código no
        // navegador de quem visse a Galeria (roubando o token de sessão salvo
        // no localStorage, por exemplo).
        function escaparHtml(texto) {
            const div = document.createElement('div');
            div.innerText = texto ?? '';
            return div.innerHTML;
        }

        function formatarData(dataIso) {
            return new Date(dataIso).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
        }

        function renderizar(projetos) {
            const container = document.getElementById('lista-galeria');

            if (!projetos || projetos.length === 0) {
                container.innerHTML = `<p class="text-sm bg-white rounded-lg p-5 border" style="color: var(--pibiex-texto-suave); border-color: var(--pibiex-borda);">Nenhum projeto publicado ainda. Seja o primeiro!</p>`;
                return;
            }

            container.innerHTML = projetos.map(p => `
                <div class="bg-white rounded-lg border overflow-hidden" style="border-color: var(--pibiex-borda);">
                    ${p.arquivo_url ? `<img src="${escaparHtml(p.arquivo_url)}" class="w-full max-h-80 object-cover" onerror="this.style.display='none'">` : ''}
                    <div class="p-4">
                        <p class="font-semibold text-[15px]" style="color: var(--pibiex-texto);">${escaparHtml(p.titulo)}</p>
                        <p class="text-[11px] mb-2" style="color: var(--pibiex-texto-suave);">${escaparHtml(p.autorNome)} · ${formatarData(p.criado_em)}</p>
                        ${p.descricao ? `<p class="text-sm mb-3" style="color: var(--pibiex-texto-suave);">${escaparHtml(p.descricao)}</p>` : ''}

                        <button onclick="alternarCurtida('${p.id}', ${p.euCurti})"
                                class="text-xs font-semibold px-3 py-1 rounded-full mb-3"
                                style="${p.euCurti ? 'background: var(--pibiex-tinta); color: white;' : 'background: var(--pibiex-papel); color: var(--pibiex-texto-suave);'}">
                            ${p.euCurti ? '♥' : '♡'} ${p.totalCurtidas}
                        </button>

                        <div class="space-y-1.5 mb-3">
                            ${p.comentarios.map(c => `
                                <p class="text-xs" style="color: var(--pibiex-texto-suave);"><span class="font-semibold" style="color: var(--pibiex-texto);">${escaparHtml(c.autorNome)}:</span> ${escaparHtml(c.comentario)}</p>
                            `).join('')}
                        </div>

                        <form onsubmit="return comentar(event, '${p.id}')" class="flex gap-2">
                            <input id="comentario-${p.id}" placeholder="Escreva um comentário..." class="flex-1 border rounded-full px-3 py-1.5 text-xs" style="border-color: var(--pibiex-borda);">
                            <button type="submit" class="text-xs font-semibold px-3 py-1.5 rounded-full" style="background: var(--pibiex-tinta); color: white;">Enviar</button>
                        </form>
                    </div>
                </div>
            `).join('');
        }

        window.alternarCurtida = async (projetoId, jaCurti) => {
            const { data, error } = await window.supabaseClient.functions.invoke('galeria', {
                body: { token: TOKEN_ALUNO, acao: jaCurti ? 'descurtir' : 'curtir', projetoId },
            });
            if (error || !data || data.erro) {
                alert((data && data.erro) || 'Não foi possível curtir agora. Tente novamente.');
                return;
            }
            await carregar();
        };

        window.comentar = async (event, projetoId) => {
            event.preventDefault();
            const input = document.getElementById(`comentario-${projetoId}`);
            const comentario = input.value.trim();
            if (!comentario) return false;

            input.value = '';
            const { data, error } = await window.supabaseClient.functions.invoke('galeria', {
                body: { token: TOKEN_ALUNO, acao: 'comentar', projetoId, comentario },
            });
            if (error || !data || data.erro) {
                alert((data && data.erro) || 'Não foi possível comentar agora. Tente novamente.');
                input.value = comentario;
                return false;
            }
            await carregar();
            return false;
        };

        document.getElementById('form-postar').addEventListener('submit', async (e) => {
            e.preventDefault();
            const titulo = document.getElementById('novo-titulo').value.trim();
            const descricao = document.getElementById('novo-descricao').value.trim();
            const inputArquivo = document.getElementById('novo-arquivo');
            const link = document.getElementById('novo-link').value.trim();
            const btn = document.getElementById('btn-postar');
            const msg = document.getElementById('msg-postar');
            msg.classList.add('hidden');
            if (!titulo) return;

            const arquivo = inputArquivo.files[0];
            btn.innerText = 'Publicando...';
            btn.disabled = true;

            try {
                let arquivoUrl = link;

                if (arquivo) {
                    const { data: urlDados, error: erroUrl } = await window.supabaseClient.functions.invoke('galeria', {
                        body: { token: TOKEN_ALUNO, acao: 'gerar_url_upload', nomeArquivo: arquivo.name },
                    });
                    if (erroUrl || !urlDados || urlDados.erro) throw new Error((urlDados && urlDados.erro) || 'Erro ao preparar envio do arquivo.');

                    const { error: erroUpload } = await window.supabaseClient
                        .storage.from('arquivos')
                        .uploadToSignedUrl(urlDados.caminho, urlDados.token, arquivo);
                    if (erroUpload) throw new Error('Erro ao enviar o arquivo.');

                    const { data: urlPublica } = window.supabaseClient.storage.from('arquivos').getPublicUrl(urlDados.caminho);
                    arquivoUrl = urlPublica.publicUrl;
                }

                const { data, error } = await window.supabaseClient.functions.invoke('galeria', {
                    body: { token: TOKEN_ALUNO, acao: 'postar', titulo, descricao, arquivoUrl },
                });
                if (error || !data || data.erro) throw new Error((data && data.erro) || 'Erro ao publicar. Tente novamente.');

                document.getElementById('form-postar').reset();
                await carregar();
            } catch (erro) {
                msg.innerText = erro.message || 'Erro ao publicar. Tente novamente.';
                msg.className = 'text-xs text-red-600';
                msg.classList.remove('hidden');
            } finally {
                btn.innerText = 'Publicar';
                btn.disabled = false;
            }
        });

        async function carregar() {
            const { data, error } = await window.supabaseClient.functions.invoke('galeria', {
                body: { token: TOKEN_ALUNO, acao: 'listar' },
            });
            if (error || !data || data.erro) {
                document.getElementById('lista-galeria').innerHTML = `<p class="text-sm text-red-600">Não foi possível carregar a galeria.</p>`;
                return;
            }
            renderizar(data.projetos);
        }

        iniciarShellAluno('galeria').then((dados) => {
            if (!dados) return;
            TOKEN_ALUNO = localStorage.getItem('pibiex_aluno_token');
            carregar();
        });
    </script>
</body>
</html>
