<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria · PIBIEX Digital</title>
    <link rel="stylesheet" href="/tailwind.css">
    <link rel="stylesheet" href="/pibiex-ui.css">
    <script src="/acessibilidade.js"></script>
    <script src="/mascote.js"></script>
    <script src="/painel-listas.js"></script>
    <script src="/leitor-material.js"></script>
    <script src="/galeria-previa.js"></script>
    <link rel="stylesheet" href="/fonts/inter.css">
    <script src="/vendor/supabase/supabase.js"></script>
    <script src="/simulacao.js"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="flex min-h-screen">

    <div id="sidebar-container"></div>

    <div class="flex-1 min-w-0">
        <div id="topo-pagina"></div>

        <main class="p-4 md:p-9 max-w-5xl mx-auto">
            <h1 class="fonte-display text-2xl font-semibold mb-1" style="color: var(--pibiex-texto);">Galeria</h1>
            <p class="text-sm mb-6" style="color: var(--pibiex-texto-suave);">Compartilhe o que você produziu com IA. Curta e comente os projetos dos colegas.</p>

            <details id="bloco-postar" class="cx mb-6">
                <summary><span class="min-w-0 flex-1"><span class="cx-titulo block">+ Publicar um projeto</span><span class="cx-sub block">Mostre o que você produziu com IA.</span></span></summary>
                <div class="cx-corpo">
            <form id="form-postar" class="space-y-2" style="border-color: var(--pibiex-borda);">
                <input id="novo-titulo" placeholder="Título do projeto" required class="w-full border rounded-md px-3 py-2 text-sm" style="border-color: var(--pibiex-borda);">
                <textarea id="novo-descricao" placeholder="Descreva seu projeto (opcional)" rows="2" class="w-full border rounded-md px-3 py-2 text-sm" style="border-color: var(--pibiex-borda);"></textarea>
                <select id="novo-assunto" aria-label="Assunto do projeto" class="w-full border rounded-md px-3 py-2 text-sm bg-white" style="border-color: var(--pibiex-borda);">
                    <option value="">Assunto do projeto (escolha um)</option>
                    <option>NotebookLM</option>
                    <option>Perplexity</option>
                    <option>Imagens com IA</option>
                    <option>Textos e escrita</option>
                    <option>Outro</option>
                </select>
                <div class="flex flex-wrap gap-2">
                    <input id="novo-arquivo" type="file" class="flex-1 min-w-[160px] text-sm">
                    <input id="novo-link" type="url" placeholder="Ou cole um link (opcional)" class="flex-1 min-w-[160px] border rounded-md px-3 py-2 text-sm" style="border-color: var(--pibiex-borda);">
                </div>
                <p id="msg-postar" class="text-xs hidden"></p>
                <button type="submit" id="btn-postar" class="text-white text-xs font-semibold px-4 py-2 rounded-md" style="background: var(--pibiex-tinta);">Publicar</button>
            </form>
                </div>
            </details>

            <input id="busca-galeria" type="search" class="caixa-busca mb-3" placeholder="Buscar projeto pelo título, descrição ou autor" aria-label="Buscar projeto" autocomplete="off">
            <select id="filtro-assunto" class="caixa-busca mb-4 hidden" aria-label="Filtrar projetos por assunto"></select>
            <div id="abas-galeria" class="mb-5"></div>
            <div id="lista-galeria" class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3 items-start">
                <div class="skel" role="status" aria-label="Carregando"><i></i><i></i><i></i></div>
            </div>
        </main>
    </div>

    <div id="assistente-flutuante"></div>

    <script src="shell.js"></script>
    <script>
        let TOKEN_ALUNO = null;

        // Nunca confiar em título/descrição/comentário como HTML pronto — são
        // texto digitado por outro aluno. Sem isso, dava pra publicar um
        // projeto com um <img onerror="..."> no título e rodar código no
        // navegador de quem visse a Galeria (roubando o token de sessão salvo
        // no localStorage, por exemplo).
        function escaparHtml(texto) {
            const div = document.createElement('div');
            div.innerText = texto ?? '';
            return div.innerHTML;
        }

        function formatarData(dataIso) {
            return new Date(dataIso).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
        }

        function urlSegura(url) {
            return /^https?:\/\//i.test(url ?? '') ? url : '#';
        }

        const L = window.PibiexLista;
        let PROJETOS = [], EU_ID = null, ABA = 'todos', ASSUNTO = '';
        const RASCUNHO_COMENTARIO = {};

        window.guardarComentario = (id) => { const c = document.getElementById(`comentario-${id}`); if (c) RASCUNHO_COMENTARIO[id] = c.value; };

        function renderizar(novos) {
            if (novos) PROJETOS = novos;
            const container = document.getElementById('lista-galeria');
            const termo = document.getElementById('busca-galeria').value.trim().toLowerCase();
            const meus = PROJETOS.filter((p) => EU_ID && p.aluno_id === EU_ID);
            L.abas(document.getElementById('abas-galeria'), PROJETOS.length ? [
                { id: 'todos', rotulo: 'Todos os projetos', n: PROJETOS.length },
                { id: 'meus', rotulo: 'Meus projetos', n: meus.length },
            ] : [], ABA, (id) => { ABA = id; renderizar(); });
            desenharFiltroAssunto();
            let projetos = (ABA === 'meus' ? meus : PROJETOS)
                .filter((p) => !ASSUNTO || (ASSUNTO === '__sem' ? !p.assunto : p.assunto === ASSUNTO))
                .filter((p) => !termo || `${p.titulo || ''} ${p.descricao || ''} ${p.autorNome || ''} ${p.assunto || ''}`.toLowerCase().includes(termo));
            if (PROJETOS.length && projetos.length === 0) {
                container.innerHTML = `<div class="vazio-lista" style="grid-column: 1 / -1;"><b>${ABA === 'meus' && !termo && !ASSUNTO ? 'Você ainda não publicou nenhum projeto' : 'Nenhum projeto encontrado'}</b>${ABA === 'meus' && !termo && !ASSUNTO ? 'Use “+ Publicar um projeto” acima.' : 'Mude a busca ou o assunto.'}</div>`;
                return;
            }

            if (!projetos || projetos.length === 0) {
                container.innerHTML = `<p class="text-sm bg-white rounded-lg p-5 border" style="grid-column: 1 / -1; color: var(--pibiex-texto-suave); border-color: var(--pibiex-borda);">Nenhum projeto publicado ainda. Seja o primeiro!</p>`;
                return;
            }

            container.innerHTML = projetos.map(p => {
                const todos = p.comentarios || [];
                const mostrarTodos = EXPANDIDOS.has(p.id) || todos.length <= 2;
                const visiveis = mostrarTodos ? todos : todos.slice(-2);
                return `
                <article class="bg-white rounded-xl border overflow-hidden" style="border-color: var(--pibiex-borda);">
                    ${PibiexGaleriaPrevia.html(p)}
                    <div class="p-4">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="avatar-ini" aria-hidden="true">${escaparHtml(L.iniciais(p.autorNome))}</span>
                            <p class="text-[11px] min-w-0" style="color: var(--pibiex-texto-suave);"><span class="font-semibold" style="color: var(--pibiex-texto);">${escaparHtml(p.autorNome)}</span> · ${formatarData(p.criado_em)}</p>
                        </div>
                        ${p.assunto ? `<span class="chip azul mb-2">${escaparHtml(p.assunto)}</span>` : ''}
                        <h2 class="font-semibold text-[15px] leading-snug" style="color: var(--pibiex-texto); overflow-wrap: anywhere;">${escaparHtml(p.titulo)}</h2>
                        ${p.descricao ? `<p class="text-sm mt-1 mb-2 whitespace-pre-wrap" style="color: var(--pibiex-texto-suave); overflow-wrap: anywhere;">${escaparHtml(p.descricao)}</p>` : '<div class="mb-2"></div>'}

                        <div class="flex items-center gap-3 mb-3">
                            <button onclick="alternarCurtida('${p.id}', ${p.euCurti})" aria-label="${p.euCurti ? 'Descurtir' : 'Curtir'}"
                                    class="text-xs font-semibold px-3 py-1 rounded-full"
                                    style="${p.euCurti ? 'background: var(--pibiex-tinta); color: white;' : 'background: var(--pibiex-papel); color: var(--pibiex-texto-suave);'}">
                                ${icone('coracao', 14, p.euCurti)} ${p.totalCurtidas}
                            </button>
                            <span class="text-xs" style="color: var(--pibiex-texto-suave);">${todos.length} ${todos.length === 1 ? 'comentário' : 'comentários'}</span>
                        </div>

                        <div class="space-y-1.5 mb-3">
                            ${!mostrarTodos ? `<button type="button" onclick="mostrarComentarios('${p.id}')" class="text-xs font-semibold underline" style="color: var(--pibiex-tinta);">Ver os ${todos.length} comentários</button>` : ''}
                            ${visiveis.map(c => `
                                <p class="text-xs" style="color: var(--pibiex-texto-suave); overflow-wrap: anywhere;"><span class="font-semibold" style="color: var(--pibiex-texto);">${escaparHtml(c.autorNome)}:</span> ${escaparHtml(c.comentario)}</p>
                            `).join('')}
                        </div>

                        <form onsubmit="return comentar(event, '${p.id}')" class="flex gap-2">
                            <input id="comentario-${p.id}" aria-label="Escreva um comentário" value="${escaparHtml(RASCUNHO_COMENTARIO[p.id] || '')}" oninput="guardarComentario('${p.id}')" placeholder="Escreva um comentário..." class="flex-1 min-w-0 border rounded-full px-3 py-1.5 text-xs" style="border-color: var(--pibiex-borda);">
                            <button type="submit" class="text-xs font-semibold px-3 py-1.5 rounded-full" style="background: var(--pibiex-tinta); color: white;">Enviar</button>
                        </form>
                    </div>
                </article>`;
            }).join('');
            PibiexGaleriaPrevia.ativar(container, projetos);
        }

        const EXPANDIDOS = new Set();
        window.mostrarComentarios = (id) => { EXPANDIDOS.add(id); renderizar(); };

        // Seletor "Todos os assuntos": só aparece quando algum projeto tem assunto, e só lista os que têm projeto.
        function desenharFiltroAssunto() {
            const sel = document.getElementById('filtro-assunto');
            const contagem = {};
            let semAssunto = 0;
            PROJETOS.forEach((p) => { if (p.assunto) contagem[p.assunto] = (contagem[p.assunto] || 0) + 1; else semAssunto++; });
            const nomes = Object.keys(contagem).sort((a, b) => a.localeCompare(b, 'pt-BR'));
            sel.classList.toggle('hidden', nomes.length === 0);
            if (!nomes.length) { ASSUNTO = ''; return; }
            if (ASSUNTO && ASSUNTO !== '__sem' && !contagem[ASSUNTO]) ASSUNTO = '';
            sel.innerHTML = `<option value="">Todos os assuntos (${PROJETOS.length})</option>`
                + nomes.map((n) => `<option value="${escaparHtml(n)}">${escaparHtml(n)} (${contagem[n]})</option>`).join('')
                + (semAssunto ? `<option value="__sem">Sem assunto (${semAssunto})</option>` : '');
            sel.value = ASSUNTO;
        }
        document.getElementById('filtro-assunto').addEventListener('change', (e) => { ASSUNTO = e.target.value; renderizar(); });

        window.alternarCurtida = async (projetoId, jaCurti) => {
            const { data, error } = await window.supabaseClient.functions.invoke('galeria', {
                body: { token: TOKEN_ALUNO, acao: jaCurti ? 'descurtir' : 'curtir', projetoId },
            });
            if (error || !data || data.erro) {
                alert((data && data.erro) || 'Não foi possível curtir agora. Tente novamente.');
                return;
            }
            await carregar();
        };

        window.comentar = async (event, projetoId) => {
            event.preventDefault();
            const input = document.getElementById(`comentario-${projetoId}`);
            const comentario = input.value.trim();
            if (!comentario) return false;

            input.value = '';
            delete RASCUNHO_COMENTARIO[projetoId];
            const { data, error } = await window.supabaseClient.functions.invoke('galeria', {
                body: { token: TOKEN_ALUNO, acao: 'comentar', projetoId, comentario },
            });
            if (error || !data || data.erro) {
                alert((data && data.erro) || 'Não foi possível comentar agora. Tente novamente.');
                input.value = comentario;
                RASCUNHO_COMENTARIO[projetoId] = comentario;
                return false;
            }
            await carregar();
            return false;
        };

        document.getElementById('form-postar').addEventListener('submit', async (e) => {
            e.preventDefault();
            const titulo = document.getElementById('novo-titulo').value.trim();
            const descricao = document.getElementById('novo-descricao').value.trim();
            const inputArquivo = document.getElementById('novo-arquivo');
            const link = document.getElementById('novo-link').value.trim();
            const assunto = document.getElementById('novo-assunto').value;
            const btn = document.getElementById('btn-postar');
            const msg = document.getElementById('msg-postar');
            msg.classList.add('hidden');
            if (!titulo) return;

            const arquivo = inputArquivo.files[0];
            btn.innerText = 'Publicando...';
            btn.disabled = true;

            try {
                let arquivoUrl = link;

                if (arquivo) {
                    const { data: urlDados, error: erroUrl } = await window.supabaseClient.functions.invoke('galeria', {
                        body: { token: TOKEN_ALUNO, acao: 'gerar_url_upload', nomeArquivo: arquivo.name },
                    });
                    if (erroUrl || !urlDados || urlDados.erro) throw new Error((urlDados && urlDados.erro) || 'Erro ao preparar envio do arquivo.');

                    const { error: erroUpload } = await window.supabaseClient
                        .storage.from('arquivos')
                        .uploadToSignedUrl(urlDados.caminho, urlDados.token, arquivo);
                    if (erroUpload) throw new Error('Erro ao enviar o arquivo.');

                    const { data: urlPublica } = window.supabaseClient.storage.from('arquivos').getPublicUrl(urlDados.caminho);
                    arquivoUrl = urlPublica.publicUrl;
                }

                const { data, error } = await window.supabaseClient.functions.invoke('galeria', {
                    body: { token: TOKEN_ALUNO, acao: 'postar', titulo, descricao, arquivoUrl, assunto },
                });
                if (error || !data || data.erro) throw new Error((data && data.erro) || 'Erro ao publicar. Tente novamente.');

                document.getElementById('form-postar').reset();
                document.getElementById('bloco-postar').open = false;
                ABA = 'meus';
                await carregar();
            } catch (erro) {
                msg.innerText = erro.message || 'Erro ao publicar. Tente novamente.';
                msg.className = 'text-xs text-red-600';
                msg.classList.remove('hidden');
            } finally {
                btn.innerText = 'Publicar';
                btn.disabled = false;
            }
        });

        async function carregar() {
            const { data, error } = await window.supabaseClient.functions.invoke('galeria', {
                body: { token: TOKEN_ALUNO, acao: 'listar' },
            });
            if (error || !data || data.erro) {
                document.getElementById('lista-galeria').innerHTML = `<p class="text-sm text-red-600">Não foi possível carregar a galeria.</p>`;
                return;
            }
            renderizar(data.projetos);
        }

        document.getElementById('busca-galeria').addEventListener('input', () => renderizar());

        iniciarShellAluno('galeria').then((dados) => {
            if (!dados) return;
            EU_ID = dados.id || null;
            TOKEN_ALUNO = localStorage.getItem('pibiex_aluno_token');
            carregar();
        });
    </script>
</body>
</html>
