<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIBIEX Digital · Desafios Semanais</title>
    <link rel="stylesheet" href="/tailwind.css">
    <link rel="stylesheet" href="/pibiex-ui.css">
    <script src="/acessibilidade.js"></script>
    <script src="/painel-listas.js"></script>
    <link rel="stylesheet" href="/fonts/inter.css">
    <script src="/vendor/supabase/supabase.js"></script>
    <script src="/simulacao.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        @keyframes surgir { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .surge { animation: surgir .3s ease both; }
    </style>
</head>
<body class="flex min-h-screen">

    <div id="sidebar-container"></div>

    <div class="flex-1 min-w-0">
        <div id="topo-pagina"></div>

        <main class="p-4 md:p-9 max-w-4xl mx-auto">
            <h1 class="fonte-display text-2xl font-semibold mb-1" style="color: var(--pibiex-texto);">Desafios Semanais</h1>
            <p class="text-sm mb-7" style="color: var(--pibiex-texto-suave);">Cumpra os desafios, ganhe pontos e suba no ranking da turma.</p>

            <!-- Meu progresso -->
            <div id="cartao-progresso" class="rounded-2xl overflow-hidden mb-7 relative" style="background: var(--pibiex-gradiente);">
                <div class="pibiex-textura-grade"></div>
                <p class="text-center text-sm py-8 relative" style="color: var(--pibiex-dourado);">Carregando seu progresso...</p>
            </div>

            <!-- Ranking -->
            <div class="mb-8">
                <div id="abas-ranking" class="mb-3"></div>
                <div id="area-ranking" class="bg-white border rounded-lg p-5" style="border-color: var(--pibiex-borda);">
                    <p class="text-sm" style="color: var(--pibiex-texto-suave);">Carregando ranking...</p>
                </div>
            </div>

            <!-- Desafios -->
            <p class="text-[11px] font-bold uppercase tracking-[0.14em] mb-3" style="color: var(--pibiex-texto-suave);">Seus desafios</p>
            <div id="abas-desafios" class="mb-4"></div>
            <div id="lista-desafios">
                <div class="skel" role="status" aria-label="Carregando"><i></i><i></i><i></i></div>
            </div>
        </main>
    </div>

    <div id="assistente-flutuante"></div>

    <script src="shell.js"></script>
    <script>
        let TOKEN_ALUNO = null;
        let ABA_RANKING = 'semana';
        let ULTIMO_PAINEL = null;

        function escaparHtml(texto) {
            const div = document.createElement('div');
            div.innerText = texto ?? '';
            return div.innerHTML;
        }
        function urlSegura(url) {
            return /^https?:\/\//i.test(url ?? '') ? url : '#';
        }

        function formatarData(dataIso) {
            if (!dataIso) return '';
            const [ano, mes, dia] = dataIso.split('-');
            return `${dia}/${mes}`;
        }

        // Pódio sem emoji: a posição em dourado, prata e bronze.
        const COR_POSICAO = { 1: '#CA8A04', 2: '#64748B', 3: '#C2410C' };

        // ============================================================
        // Cartão de progresso (nível, pontos, barra até o próximo nível)
        // ============================================================
        function renderizarProgresso(eu) {
            const nivel = eu.nivel;
            const proximo = nivel.pontosParaProximo;
            // A largura da barra é só estética — sem o total do próximo nível
            // exato aqui, uma faixa fixa de progresso já passa a ideia de avanço.
            const percentual = proximo === null ? 100 : Math.max(8, Math.min(92, 100 - proximo));

            document.getElementById('cartao-progresso').innerHTML = `
                <div class="pibiex-textura-grade"></div>
                <div class="px-7 py-6 flex flex-wrap items-center justify-between gap-5 relative">
                    <div>
                        <p class="text-[11px] font-black uppercase tracking-[0.16em]" style="color: var(--pibiex-dourado);">Nível ${nivel.faixa} · ${escaparHtml(nivel.nome)}</p>
                        <p class="fonte-display text-white text-3xl mt-1">${eu.pontos} pontos</p>
                        <p class="text-blue-100/70 text-xs mt-1">${eu.desafiosFeitos} ${eu.desafiosFeitos === 1 ? 'desafio avaliado' : 'desafios avaliados'}</p>
                    </div>
                    <div class="w-full sm:w-56">
                        <div class="h-2 rounded-full overflow-hidden" style="background: rgba(255,255,255,.12);">
                            <div class="h-full rounded-full" style="width: ${percentual}%; background: var(--pibiex-dourado);"></div>
                        </div>
                        <p class="text-[11px] mt-1.5" style="color: rgba(255,255,255,.55);">
                            ${proximo === null ? 'Nível máximo alcançado!' : `Faltam ${proximo} pontos para o próximo nível`}
                        </p>
                    </div>
                </div>
            `;
        }

        // ============================================================
        // Ranking (pódio + minha posição)
        // ============================================================
        function renderizarRanking(dados, semanaAtual) {
            const area = document.getElementById('area-ranking');

            if (!dados.alguemPontuou) {
                area.innerHTML = `
                    <p class="text-sm text-center py-4" style="color: var(--pibiex-texto-suave);">
                        Ninguém pontuou ${ABA_RANKING === 'semana' ? 'nesta semana' : 'ainda'}. Envie um desafio e seja o primeiro do pódio!
                    </p>
                `;
                return;
            }

            const podioHtml = dados.podio.map((p) => `
                <div class="flex flex-col items-center ${p.posicao === 1 ? 'order-2' : p.posicao === 2 ? 'order-1' : 'order-3'}">
                    <div class="rounded-full flex items-center justify-center font-black ${p.posicao === 1 ? 'w-16 h-16 text-xl' : 'w-12 h-12 text-base'} mb-1.5"
                         style="background: var(--pibiex-papel); border: 2px solid ${p.souEu ? 'var(--pibiex-dourado)' : 'var(--pibiex-borda)'}; color: ${COR_POSICAO[p.posicao]};">
                        ${p.posicao}º
                    </div>
                    <p class="text-[13px] font-bold text-center max-w-[92px] truncate" style="color: var(--pibiex-texto);">
                        ${p.souEu ? 'Você' : escaparHtml(p.nome.split(' ')[0])}
                    </p>
                    <p class="text-[11px] font-semibold" style="color: var(--pibiex-dourado);">${p.pontos} pts</p>
                </div>
            `).join('');

            const minhaLinha = dados.eu && dados.eu.posicao > 3 ? `
                <div class="mt-5 pt-4 border-t flex items-center justify-between" style="border-color: var(--pibiex-borda);">
                    <p class="text-[13px]" style="color: var(--pibiex-texto-suave);">
                        Sua posição: <span class="font-bold" style="color: var(--pibiex-texto);">${dados.eu.posicao}º</span> de ${dados.totalAlunos}
                    </p>
                    <p class="text-[13px] font-bold" style="color: var(--pibiex-texto);">${dados.eu.pontos} pts</p>
                </div>
            ` : (dados.eu && dados.eu.pontos === 0 ? `
                <div class="mt-5 pt-4 border-t text-center" style="border-color: var(--pibiex-borda);">
                    <p class="text-[13px]" style="color: var(--pibiex-texto-suave);">Você ainda não pontuou ${ABA_RANKING === 'semana' ? 'nesta semana' : ''}. Envie um desafio!</p>
                </div>
            ` : '');

            area.innerHTML = `
                <div class="flex items-end justify-center gap-6 surge">${podioHtml}</div>
                ${minhaLinha}
            `;
        }

        window.trocarAbaRanking = (aba) => {
            ABA_RANKING = aba;
            pintarAbasRanking();
            if (ULTIMO_PAINEL) {
                renderizarRanking(aba === 'semana' ? ULTIMO_PAINEL.rankingSemana : ULTIMO_PAINEL.rankingGeral, ULTIMO_PAINEL.semanaAtual);
            }
        };

        function pintarAbasRanking() {
            window.PibiexLista.abas(document.getElementById('abas-ranking'), [
                { id: 'semana', rotulo: 'Ranking da semana', n: '' },
                { id: 'geral', rotulo: 'Ranking geral', n: '' },
            ], ABA_RANKING, (id) => window.trocarAbaRanking(id));
        }

        // ============================================================
        // Desafios
        // ============================================================
        const L = window.PibiexLista;
        let DESAFIOS = [];
        let ABA = null;                // 'afazer' | 'enviados' | 'corrigidos' | 'encerrados'
        let ABERTO = null;
        const RASCUNHO = {};           // link já digitado

        function estadoDe(d, hoje) {
            const envio = d.meuEnvio;
            if (envio && envio.avaliado) return 'corrigidos';
            if (envio) return 'enviados';
            return (d.dataFim && d.dataFim < hoje) ? 'encerrados' : 'afazer';
        }

        window.guardarLink = (id) => { const c = document.getElementById(`link-${id}`); if (c) RASCUNHO[id] = c.value; };

        function renderizarDesafios(desafios) {
            if (desafios) DESAFIOS = desafios;
            const container = document.getElementById('lista-desafios');

            if (!DESAFIOS || DESAFIOS.length === 0) {
                document.getElementById('abas-desafios').innerHTML = '';
                container.innerHTML = `<p class="text-sm bg-white rounded-lg p-5 border" style="color: var(--pibiex-texto-suave); border-color: var(--pibiex-borda);">Nenhum desafio publicado ainda.</p>`;
                return;
            }

            const hoje = new Date().toISOString().slice(0, 10);
            const n = { afazer: 0, enviados: 0, corrigidos: 0, encerrados: 0 };
            DESAFIOS.forEach((d) => { n[estadoDe(d, hoje)]++; });
            if (ABA === null) {
                ABA = n.afazer ? 'afazer' : (n.enviados ? 'enviados' : (n.corrigidos ? 'corrigidos' : 'encerrados'));
                const primeiro = DESAFIOS.find((d) => estadoDe(d, hoje) === ABA);
                ABERTO = primeiro ? primeiro.id : null;
            }
            L.abas(document.getElementById('abas-desafios'), [
                { id: 'afazer', rotulo: 'A fazer', n: n.afazer, alerta: n.afazer > 0 },
                { id: 'enviados', rotulo: 'Enviados', n: n.enviados },
                { id: 'corrigidos', rotulo: 'Corrigidos', n: n.corrigidos },
                { id: 'encerrados', rotulo: 'Prazo encerrado', n: n.encerrados },
            ], ABA, (id) => {
                ABA = id;
                const primeiro = DESAFIOS.find((d) => estadoDe(d, hoje) === id);
                ABERTO = (id === 'afazer' && primeiro) ? primeiro.id : null;
                renderizarDesafios();
            });

            const lista = DESAFIOS.filter((d) => estadoDe(d, hoje) === ABA);
            if (!lista.length) {
                const msgs = { afazer: ['Tudo em dia', 'Você não tem desafios pendentes.'], enviados: ['Nada aguardando correção', ''], corrigidos: ['Nenhum desafio corrigido ainda', 'A nota aparece aqui quando o professor corrigir.'], encerrados: ['Nenhum desafio com prazo encerrado', ''] };
                container.innerHTML = `<div class="vazio-lista"><b>${msgs[ABA][0]}</b>${msgs[ABA][1]}</div>`;
                return;
            }

            container.innerHTML = lista.map((d) => {
                const envio = d.meuEnvio;
                const est = estadoDe(d, hoje);
                const encerrado = est === 'encerrados';
                const chipEstado = est === 'corrigidos' ? `<span class="chip verde">${icone('sucesso', 12)} ${envio.pontos ?? ''}${envio.pontos != null ? ' pts' : 'Corrigido'}</span>`
                    : est === 'enviados' ? '<span class="chip azul">Aguardando correção</span>'
                    : encerrado ? '<span class="chip vermelho">Prazo encerrado</span>' : '<span class="chip ambar">A fazer</span>';

                return `
                    <details class="cx" data-id="${escaparHtml(d.id)}" ${ABERTO === d.id ? 'open' : ''}>
                        <summary>
                            <span class="min-w-0 flex-1">
                                <span class="cx-titulo block">${escaparHtml(d.titulo)}</span>
                                <span class="flex flex-wrap gap-1.5 mt-2">
                                    ${chipEstado}
                                    ${d.semana ? `<span class="chip cinza">Semana ${escaparHtml(d.semana)}</span>` : ''}
                                    <span class="chip ambar">${escaparHtml(d.pontos)} pts</span>
                                    ${d.dataFim ? `<span class="chip cinza">até ${formatarData(d.dataFim)}</span>` : ''}
                                </span>
                            </span>
                        </summary>
                        <div class="cx-corpo">
                        <p class="text-sm mb-4 whitespace-pre-wrap" style="color: var(--pibiex-texto-suave);">${escaparHtml(d.descricao)}</p>

                        ${envio ? `
                            <p class="text-xs mb-2" style="color: var(--pibiex-texto-suave);">
                                Você enviou: <a href="${escaparHtml(urlSegura(envio.linkOuArquivo))}" target="_blank" rel="noopener" class="underline font-semibold" style="color: var(--pibiex-tinta);">abrir resposta</a>
                            </p>
                        ` : ''}

                        ${envio && envio.avaliado && envio.feedback ? `
                            <div class="rounded-md px-3 py-2 mb-3 text-xs" style="background: var(--pibiex-papel); color: var(--pibiex-texto);">
                                <span class="font-bold">Comentário do professor:</span> ${escaparHtml(envio.feedback)}
                            </div>
                        ` : ''}

                        ${(envio && envio.avaliado) || encerrado ? '' : `
                            <div class="flex flex-wrap items-end gap-2 pt-3 border-t" style="border-color: var(--pibiex-borda);">
                                <div class="flex-1 min-w-[160px]">
                                    <label for="arquivo-${d.id}" class="block text-[11px] font-semibold mb-1" style="color: var(--pibiex-texto-suave);">Enviar arquivo</label>
                                    <input type="file" id="arquivo-${d.id}" class="text-xs w-full">
                                </div>
                                <div class="flex-1 min-w-[160px]">
                                    <label for="link-${d.id}" class="block text-[11px] font-semibold mb-1" style="color: var(--pibiex-texto-suave);">${envio ? 'Ou substituir link' : 'Ou cole um link'}</label>
                                    <input type="url" id="link-${d.id}" placeholder="https://..." value="${envio ? escaparHtml(envio.linkOuArquivo) : ''}" oninput="guardarLink('${d.id}')"
                                           class="w-full border rounded-md px-2.5 py-1.5 text-xs" style="border-color: var(--pibiex-borda);">
                                </div>
                                <button onclick="enviarResposta('${d.id}')" id="btn-${d.id}"
                                        class="text-white text-xs font-semibold px-4 py-2 rounded-md shrink-0" style="background: var(--pibiex-tinta);">
                                    ${envio ? 'Reenviar' : 'Enviar'}
                                </button>
                            </div>
                        `}
                        <p id="msg-${d.id}" class="text-xs mt-2 hidden"></p>
                        </div>
                    </details>
                `;
            }).join('');

            container.querySelectorAll('details.cx').forEach((det) => {
                det.addEventListener('toggle', () => { if (det.open) ABERTO = det.dataset.id; else if (ABERTO === det.dataset.id) ABERTO = null; });
            });
            Object.keys(RASCUNHO).forEach((id) => { const c = document.getElementById(`link-${id}`); if (c && RASCUNHO[id] !== undefined) c.value = RASCUNHO[id]; });
        }

        window.enviarResposta = async (desafioId) => {
            const inputArquivo = document.getElementById(`arquivo-${desafioId}`);
            const inputLink = document.getElementById(`link-${desafioId}`);
            const btn = document.getElementById(`btn-${desafioId}`);
            const msg = document.getElementById(`msg-${desafioId}`);
            msg.classList.add('hidden');

            const arquivo = inputArquivo.files[0];
            const link = inputLink.value.trim();

            if (!arquivo && !link) {
                msg.innerText = 'Envie um arquivo ou cole um link antes de enviar.';
                msg.className = 'text-xs mt-2 text-red-600';
                msg.classList.remove('hidden');
                return;
            }

            btn.innerText = 'Enviando...';
            btn.disabled = true;

            try {
                let linkOuArquivo = link;

                // Arquivo tem prioridade sobre o link, se os dois vierem preenchidos.
                if (arquivo) {
                    const { data: urlDados, error: erroUrl } = await window.supabaseClient.functions.invoke('enviar-desafio', {
                        body: { token: TOKEN_ALUNO, acao: 'gerar_url_upload', desafioId, nomeArquivo: arquivo.name },
                    });
                    if (erroUrl || !urlDados || urlDados.erro) throw new Error((urlDados && urlDados.erro) || 'Erro ao preparar envio do arquivo.');

                    const { error: erroUpload } = await window.supabaseClient
                        .storage.from('arquivos')
                        .uploadToSignedUrl(urlDados.caminho, urlDados.token, arquivo);
                    if (erroUpload) throw new Error('Erro ao enviar o arquivo.');

                    const { data: urlPublica } = window.supabaseClient.storage.from('arquivos').getPublicUrl(urlDados.caminho);
                    linkOuArquivo = urlPublica.publicUrl;
                }

                const { data, error } = await window.supabaseClient.functions.invoke('enviar-desafio', {
                    body: { token: TOKEN_ALUNO, acao: 'enviar', desafioId, linkOuArquivo },
                });
                if (error || !data || data.erro) throw new Error((data && data.erro) || 'Erro ao enviar. Tente novamente.');

                delete RASCUNHO[desafioId];
                ABA = 'enviados'; ABERTO = desafioId;
                await carregarTudo();
            } catch (erro) {
                msg.innerText = erro.message || 'Erro ao enviar. Tente novamente.';
                msg.className = 'text-xs mt-2 text-red-600';
                msg.classList.remove('hidden');
                btn.innerText = 'Enviar';
                btn.disabled = false;
            }
        };

        // ============================================================
        // Início
        // ============================================================
        async function carregarTudo() {
            const { data, error } = await window.supabaseClient.functions.invoke('enviar-desafio', {
                body: { token: TOKEN_ALUNO, acao: 'painel' },
            });

            if (error || !data || data.erro) {
                document.getElementById('lista-desafios').innerHTML =
                    `<p class="text-sm bg-white rounded-lg p-5 border" style="color:#b91c1c; border-color: var(--pibiex-borda);">Não foi possível carregar os desafios. Tente recarregar a página.</p>`;
                return;
            }

            ULTIMO_PAINEL = data;
            renderizarProgresso(data.eu);
            renderizarRanking(ABA_RANKING === 'semana' ? data.rankingSemana : data.rankingGeral, data.semanaAtual);
            renderizarDesafios(data.desafios);
        }

        iniciarShellAluno('desafios').then((dados) => {
            if (!dados) return;
            TOKEN_ALUNO = localStorage.getItem('pibiex_aluno_token');
            pintarAbasRanking();
            carregarTudo();
        });
    </script>
</body>
</html>
