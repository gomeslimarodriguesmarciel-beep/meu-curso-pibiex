<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIBIEX Digital · Recursos Extras</title>
    <link rel="stylesheet" href="/tailwind.css">
    <link rel="stylesheet" href="/pibiex-ui.css">
    <script src="/acessibilidade.js"></script>
    <script src="/painel-listas.js"></script>
    <link rel="stylesheet" href="/fonts/inter.css">
    <script src="/vendor/supabase/supabase.js"></script>
    <script src="/simulacao.js"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="flex min-h-screen">

    <div id="sidebar-container"></div>

    <div class="flex-1 min-w-0">
        <div id="topo-pagina"></div>

        <main class="p-4 md:p-9 max-w-4xl mx-auto">
            <h1 class="fonte-display text-2xl font-semibold mb-1" style="color: var(--pibiex-texto);">Recursos Extras</h1>
            <p class="text-sm mb-7" style="color: var(--pibiex-texto-suave);">Vídeos, e-books, sites e artigos recomendados para aprofundar seus estudos.</p>

            <input id="busca-recurso" type="search" class="caixa-busca mb-4" placeholder="Buscar recurso pelo título ou descrição" aria-label="Buscar recurso" autocomplete="off">
            <div id="abas-recursos" class="mb-5"></div>
            <div id="lista-recursos" class="space-y-3">
                <div class="skel" role="status" aria-label="Carregando"><i></i><i></i><i></i></div>
            </div>
        </main>
    </div>

    <div id="assistente-flutuante"></div>

    <script src="shell.js"></script>
    <script src="../leitor-material.js"></script>
    <script>
        function escaparHtml(texto) {
            const div = document.createElement('div');
            div.innerText = texto ?? '';
            return div.innerHTML;
        }
        function urlSegura(url) {
            return /^https?:\/\//i.test(url ?? '') ? url : '#';
        }

        const ICONE_POR_TIPO = { video: 'video', ebook: 'livro', site: 'globo', artigo: 'jornal' };
        const ROTULO_TIPO = { video: 'Vídeo', ebook: 'E-book', site: 'Site', artigo: 'Artigo' };

        const L = window.PibiexLista;
        let TODOS = [];
        let FILTRO = 'todos';

        function renderizar(dados) {
            if (dados) TODOS = dados;
            const container = document.getElementById('lista-recursos');
            const termo = document.getElementById('busca-recurso').value.trim().toLowerCase();
            const base = TODOS.filter((r) => !termo || (r.titulo || '').toLowerCase().includes(termo) || (r.descricao || '').toLowerCase().includes(termo));
            const tipos = Object.keys(ROTULO_TIPO).filter((t) => TODOS.some((r) => r.tipo === t));
            if (FILTRO !== 'todos' && !tipos.includes(FILTRO)) FILTRO = 'todos';
            L.abas(document.getElementById('abas-recursos'), TODOS.length > 1 ? [{ id: 'todos', rotulo: 'Todos', n: base.length }]
                .concat(tipos.map((t) => ({ id: t, rotulo: ROTULO_TIPO[t], n: base.filter((r) => r.tipo === t).length }))) : [],
                FILTRO, (id) => { FILTRO = id; renderizar(); });
            const recursos = base.filter((r) => FILTRO === 'todos' || r.tipo === FILTRO);
            if (TODOS.length && recursos.length === 0) {
                container.innerHTML = '<div class="vazio-lista"><b>Nenhum recurso encontrado</b>Mude a busca ou o tipo.</div>';
                return;
            }

            if (!recursos || recursos.length === 0) {
                container.innerHTML = `<p class="text-sm bg-white rounded-lg p-5 border" style="color: var(--pibiex-texto-suave); border-color: var(--pibiex-borda);">Nenhum recurso cadastrado ainda.</p>`;
                return;
            }

            container.innerHTML = recursos.map((r) => {
                const arquivo = !!r.arquivo_caminho;
                const miolo = `
                    <div class="shrink-0" style="color: var(--pibiex-texto-suave);">${icone(ICONE_POR_TIPO[r.tipo] || 'link', 26)}</div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2 flex-wrap">
                            <p class="font-semibold text-[14.5px]" style="color: var(--pibiex-texto);">${escaparHtml(r.titulo)}</p>
                            <span class="text-[10px] font-bold uppercase tracking-wide px-2 py-0.5 rounded-full shrink-0" style="background: var(--pibiex-papel); color: var(--pibiex-tinta);">${escaparHtml(ROTULO_TIPO[r.tipo] || r.tipo)}</span>
                        </div>
                        ${r.descricao ? `<p class="text-xs mt-0.5" style="color: var(--pibiex-texto-suave);">${escaparHtml(r.descricao)}</p>` : ''}
                    </div>`;
                const classe = 'flex items-center gap-4 bg-white rounded-lg p-4 border hover:shadow-sm transition';
                if (!arquivo) {
                    return `<a href="${escaparHtml(urlSegura(r.url))}" target="_blank" rel="noopener" class="${classe}" style="border-color: var(--pibiex-borda);">${miolo}
                        <span class="text-sm shrink-0" style="color: var(--pibiex-texto-suave);">Abrir →</span></a>`;
                }
                const tamanho = r.arquivo_tamanho ? ` · ${(r.arquivo_tamanho / 1024 / 1024 >= 1 ? (r.arquivo_tamanho / 1024 / 1024).toFixed(1).replace('.', ',') + ' MB' : Math.max(1, Math.round(r.arquivo_tamanho / 1024)) + ' KB')}` : '';
                return `<div class="${classe}" style="border-color: var(--pibiex-borda);">
                    <button type="button" onclick="abrirRecurso('${escaparHtml(r.id)}')" class="flex items-center gap-4 flex-1 min-w-0 text-left">${miolo}
                        <span class="text-sm shrink-0 font-semibold" style="color: var(--pibiex-tinta);">Ler agora</span></button>
                    ${r.permite_baixar !== false ? `<button type="button" onclick="baixarRecurso('${escaparHtml(r.id)}', this)" class="shrink-0 text-sm font-bold px-3 py-2 rounded-lg border" style="border-color: var(--pibiex-borda); color: var(--pibiex-texto);" aria-label="Baixar ${escaparHtml(r.titulo)}">Baixar${tamanho}</button>` : ''}
                </div>`;
            }).join('');
        }

        async function pedirRecurso(recursoId, baixar) {
            const token = localStorage.getItem('pibiex_aluno_token');
            const { data, error } = await window.supabaseClient.functions.invoke('ver-material', {
                body: { token, recursoId, baixar: !!baixar },
            });
            if (error || !data || data.erro) {
                let mensagem = data && data.erro;
                if (!mensagem && error && error.context) {
                    try { mensagem = (await error.context.json()).erro; } catch (e) { /* sem corpo */ }
                }
                throw new Error(mensagem || 'Não foi possível abrir o material. Tente de novo.');
            }
            return data;
        }

        window.baixarRecurso = async (id, botao) => {
            const original = botao.innerHTML;
            botao.disabled = true; botao.textContent = 'Preparando…';
            try {
                const r = await pedirRecurso(id, true);
                const link = document.createElement('a');
                link.href = r.url; link.rel = 'noopener';
                document.body.appendChild(link); link.click(); link.remove();
            } catch (e) {
                if (window.PibiexA11y) PibiexA11y.aviso(e.message || 'Não foi possível baixar agora.');
            }
            botao.disabled = false; botao.innerHTML = original;
        };

        window.abrirRecurso = (id) => {
            const r = TODOS.find((x) => x.id === id);
            if (!r) return;
            abrirLeitorMaterial({
                titulo: r.titulo,
                chaveProgresso: 'recurso:' + id,
                obterArquivo: () => pedirRecurso(id, false),
                obterDownload: async () => (await pedirRecurso(id, true)).url,
            });
        };

        async function carregar() {
            const { data, error } = await window.supabaseClient
                .from('recursos_extras')
                .select('id, titulo, tipo, url, descricao, categoria, ordem, arquivo_caminho, arquivo_tamanho, permite_baixar')
                .order('ordem', { ascending: true });

            if (error) {
                document.getElementById('lista-recursos').innerHTML =
                    `<p class="text-sm text-red-600 bg-white rounded-lg p-5 border border-red-100">Não foi possível carregar os recursos.</p>`;
                console.error(error);
                return;
            }
            renderizar(data);
        }
        document.getElementById('busca-recurso').addEventListener('input', () => renderizar());

        iniciarShellAluno('recursos').then((dados) => {
            if (dados) carregar();
        });
    </script>
</body>
</html>
