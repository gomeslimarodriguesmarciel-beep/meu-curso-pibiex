<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIBIEX Digital · Recursos Extras</title>
    <link rel="stylesheet" href="/tailwind.css">
    <link rel="stylesheet" href="/pibiex-ui.css">
    <script src="/acessibilidade.js"></script>
    <script src="/painel-listas.js"></script>
    <link rel="stylesheet" href="/fonts/inter.css">
    <script src="/vendor/supabase/supabase.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .zona-arquivo { border: 2px dashed #cbd5e1; border-radius: 12px; background: #fff; transition: border-color .15s, background .15s; }
        .zona-arquivo.arrastando { border-color: #2563eb; background: #eff6ff; }
    </style>
</head>
<body class="flex min-h-screen bg-gray-50">

    <div id="sidebar-container"></div>

    <div class="flex-1 min-w-0">
        <div id="topo-pagina"></div>

        <main class="p-4 md:p-8 max-w-4xl mx-auto">
            <h1 class="text-2xl font-black text-gray-800 mb-1">Recursos Extras</h1>
            <p class="text-gray-500 mb-6">Vídeos, e-books, sites e artigos recomendados que aparecem na área do aluno.</p>

            <div class="flex flex-wrap items-center gap-3 mb-4">
                <input id="busca-recurso" type="search" class="caixa-busca" style="flex:1;min-width:200px" placeholder="Buscar recurso pelo título" aria-label="Buscar recurso pelo título" autocomplete="off">
                <button type="button" id="btn-novo-recurso" aria-expanded="false" aria-controls="form-novo" class="bg-gray-900 hover:bg-gray-800 text-white font-bold px-5 py-2.5 rounded-xl text-sm">+ Novo recurso</button>
            </div>
            <div id="abas-recursos" class="mb-4"></div>

            <form id="form-novo" class="hidden bg-white rounded-2xl border border-gray-100 shadow-sm p-5 mb-6 space-y-3">
                <div class="flex flex-wrap gap-3">
                    <div class="flex-1 min-w-[200px]">
                        <label class="block text-xs font-bold text-gray-500 mb-1">Título</label>
                        <input id="novo-titulo" required class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">
                    </div>
                    <div class="w-40">
                        <label class="block text-xs font-bold text-gray-500 mb-1">Tipo</label>
                        <select id="novo-tipo" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">
                            <option value="video">Vídeo</option>
                            <option value="ebook">E-book</option>
                            <option value="site">Site</option>
                            <option value="artigo">Artigo</option>
                        </select>
                    </div>
                    <div class="w-24">
                        <label class="block text-xs font-bold text-gray-500 mb-1">Ordem</label>
                        <input id="novo-ordem" type="number" value="0" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">
                    </div>
                </div>
                <div class="flex gap-4 text-sm font-semibold text-gray-700" role="radiogroup" aria-label="Origem do recurso">
                    <label class="flex items-center gap-1.5 cursor-pointer"><input type="radio" name="modo-novo" value="arquivo" checked> Enviar arquivo</label>
                    <label class="flex items-center gap-1.5 cursor-pointer"><input type="radio" name="modo-novo" value="link"> Colar link</label>
                </div>
                <div id="bloco-arquivo-novo">
                    <label id="zona-novo" class="zona-arquivo flex flex-col items-center justify-center gap-1 px-4 py-6 text-center cursor-pointer">
                        <span id="zona-texto-novo" class="text-sm font-semibold text-gray-700">Arraste o arquivo aqui ou clique para escolher</span>
                        <span class="text-xs text-gray-500">PDF, PPTX, PNG, JPG, WEBP ou MP4 · até 20 MB</span>
                        <input type="file" id="novo-arquivo" class="sr-only" accept=".pdf,.pptx,.ppt,.png,.jpg,.jpeg,.webp,.mp4">
                    </label>
                    <label class="flex items-center gap-1.5 text-xs text-gray-600 mt-2"><input type="checkbox" id="novo-baixar" checked> Permitir que o aluno baixe o arquivo</label>
                </div>
                <div id="bloco-link-novo" class="hidden">
                    <label for="novo-url" class="block text-xs font-bold text-gray-500 mb-1">URL</label>
                    <input id="novo-url" type="url" placeholder="https://..." class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">
                </div>
                <p id="msg-envio" class="hidden text-xs font-semibold text-blue-700" role="status"></p>
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">Descrição (opcional)</label>
                    <input id="novo-descricao" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">
                </div>
                <button type="submit" class="bg-gray-900 hover:bg-gray-800 text-white font-bold px-5 py-2 rounded-lg text-sm">Publicar recurso</button>
                <button type="button" id="btn-cancelar-recurso" class="ml-2 text-sm font-bold text-gray-500 hover:text-gray-800 px-3 py-2">Cancelar</button>
            </form>

            <div id="lista-recursos" class="space-y-3">
                <div class="skel" role="status" aria-label="Carregando"><i></i><i></i><i></i></div>
            </div>
        </main>
    </div>

    <script src="shell.js"></script>
    <script>
        let TOKEN_EQUIPE = null;
        let idEmEdicao = null;

        const ICONE_POR_TIPO = { video: 'video', ebook: 'livro', site: 'globo', artigo: 'jornal' };
        const ROTULO_TIPO = { video: 'Vídeo', ebook: 'E-book', site: 'Site', artigo: 'Artigo' };

        function escaparHtml(texto) {
            const div = document.createElement('div');
            div.innerText = texto ?? '';
            return div.innerHTML;
        }

        function opcoesTipo(selecionado) {
            return Object.entries(ROTULO_TIPO)
                .map(([valor, rotulo]) => `<option value="${valor}" ${valor === selecionado ? 'selected' : ''}>${rotulo}</option>`)
                .join('');
        }

        async function chamarGerenciarRecursos(acao, dados) {
            const { data, error } = await window.supabaseClient.functions.invoke('gerenciar-recursos', {
                body: { tokenEquipe: TOKEN_EQUIPE, acao, ...dados },
            });
            if (error || !data || data.erro) {
                alert((data && data.erro) ? data.erro : 'Erro ao salvar. Tente novamente.');
                return null;
            }
            return data;
        }

        const LIMITE_BYTES = 20 * 1024 * 1024;
        const EXTENSOES = ['pdf', 'pptx', 'ppt', 'png', 'jpg', 'jpeg', 'webp', 'mp4'];

        function formatarTamanho(bytes) {
            if (!bytes) return '';
            if (bytes < 1024 * 1024) return Math.max(1, Math.round(bytes / 1024)) + ' KB';
            return (bytes / 1024 / 1024).toFixed(1).replace('.', ',') + ' MB';
        }

        function validarArquivo(arquivo) {
            const i = arquivo.name.lastIndexOf('.');
            const ext = i > 0 ? arquivo.name.slice(i + 1).toLowerCase() : '';
            if (!EXTENSOES.includes(ext)) return 'Tipo não permitido. Envie PDF, PPTX, PNG, JPG, WEBP ou MP4.';
            if (arquivo.size > LIMITE_BYTES) return `O arquivo tem ${formatarTamanho(arquivo.size)} e o limite é 20 MB.`;
            if (arquivo.size === 0) return 'O arquivo está vazio.';
            return null;
        }

        // Envia o arquivo direto ao armazenamento privado e devolve os dados para salvar no recurso.
        async function enviarArquivo(arquivo) {
            const preparo = await chamarGerenciarRecursos('gerar_url_upload', { nomeArquivo: arquivo.name, tamanho: arquivo.size });
            if (!preparo) throw new Error('Não foi possível preparar o envio.');
            const { error } = await window.supabaseClient.storage
                .from('materiais')
                .uploadToSignedUrl(preparo.caminho, preparo.token, arquivo, { contentType: preparo.mime });
            if (error) throw new Error('Não foi possível enviar o arquivo. Tente de novo.');
            return { arquivoCaminho: preparo.caminho, arquivoNome: arquivo.name, arquivoTamanho: arquivo.size };
        }

        function mostrarEnvio(texto) {
            const el = document.getElementById('msg-envio');
            el.textContent = texto || '';
            el.classList.toggle('hidden', !texto);
        }

        async function carregarRecursos() {
            const resultado = await chamarGerenciarRecursos('listar', {});
            if (!resultado) {
                document.getElementById('lista-recursos').innerHTML = '<p class="text-red-500 text-sm">Erro ao carregar recursos.</p>';
                return;
            }
            renderizarRecursos(resultado.recursos || []);
        }

        const L = window.PibiexLista;
        let RECURSOS = [];
        let FILTRO = 'todos';

        function renderizarRecursos(recursos) {
            if (recursos) RECURSOS = recursos;
            const container = document.getElementById('lista-recursos');

            if (RECURSOS.length === 0) {
                document.getElementById('abas-recursos').innerHTML = '';
                container.innerHTML = '<div class="vazio-lista"><b>Nenhum recurso cadastrado ainda</b>Clique em "+ Novo recurso" para cadastrar o primeiro.</div>';
                return;
            }

            const termo = document.getElementById('busca-recurso').value.trim().toLowerCase();
            const base = RECURSOS.filter((r) => !termo || (r.titulo || '').toLowerCase().includes(termo) || (r.descricao || '').toLowerCase().includes(termo));
            const tipos = Object.keys(ROTULO_TIPO).filter((t) => RECURSOS.some((r) => r.tipo === t));
            if (FILTRO !== 'todos' && !tipos.includes(FILTRO)) FILTRO = 'todos';
            L.abas(document.getElementById('abas-recursos'), [{ id: 'todos', rotulo: 'Todos', n: base.length }]
                .concat(tipos.map((t) => ({ id: t, rotulo: ROTULO_TIPO[t], n: base.filter((r) => r.tipo === t).length }))),
                FILTRO, (id) => { FILTRO = id; renderizarRecursos(); });

            const lista = base.filter((r) => FILTRO === 'todos' || r.tipo === FILTRO);
            if (!lista.length) { container.innerHTML = '<div class="vazio-lista"><b>Nenhum recurso encontrado</b>Mude a busca ou o tipo.</div>'; return; }

            container.innerHTML = lista.map((r) => {
                if (idEmEdicao === r.id) {
                    return `
                        <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 space-y-2">
                            <input id="edit-titulo-${r.id}" value="${L.esc(r.titulo)}" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm font-bold" aria-label="Título">
                            ${r.arquivo_caminho ? `
                                <p class="text-xs text-gray-700">${icone('anexo', 14)} <b>${L.esc(r.arquivo_nome || 'arquivo')}</b>${r.arquivo_tamanho ? ' · ' + formatarTamanho(r.arquivo_tamanho) : ''}</p>
                                <label class="block text-xs font-bold text-gray-500" for="edit-arquivo-${r.id}">Trocar o arquivo (opcional)</label>
                                <input type="file" id="edit-arquivo-${r.id}" accept=".pdf,.pptx,.ppt,.png,.jpg,.jpeg,.webp,.mp4" class="block w-full text-xs text-gray-600">
                                <label class="flex items-center gap-1.5 text-xs text-gray-600"><input type="checkbox" id="edit-baixar-${r.id}" ${r.permite_baixar !== false ? 'checked' : ''}> Permitir que o aluno baixe</label>`
                              : `<input id="edit-url-${r.id}" value="${L.esc(r.url || '')}" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm" aria-label="URL">`}
                            <input id="edit-descricao-${r.id}" value="${L.esc(r.descricao || '')}" placeholder="Descrição (opcional)" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm" aria-label="Descrição">
                            <div class="flex gap-2 flex-wrap">
                                <select id="edit-tipo-${r.id}" class="border border-gray-200 rounded-lg px-3 py-2 text-sm" aria-label="Tipo">${opcoesTipo(r.tipo)}</select>
                                <input id="edit-ordem-${r.id}" type="number" value="${r.ordem ?? 0}" class="w-24 border border-gray-200 rounded-lg px-3 py-2 text-sm" aria-label="Ordem">
                                <button onclick="salvarRecurso('${r.id}')" class="bg-green-600 text-white text-xs font-bold px-3 py-2 rounded-lg">Salvar</button>
                                <button onclick="cancelarEdicao()" class="bg-gray-200 text-gray-700 text-xs font-bold px-3 py-2 rounded-lg">Cancelar</button>
                            </div>
                        </div>`;
                }
                return `
                    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-4 flex items-center justify-between gap-3 flex-wrap">
                        <div class="flex items-center gap-3 min-w-0 flex-1">
                            <span class="shrink-0 text-gray-500">${icone(ICONE_POR_TIPO[r.tipo] || 'link', 24)}</span>
                            <div class="min-w-0">
                                <p class="font-bold text-gray-800 text-sm flex items-center gap-2 flex-wrap">${L.esc(r.titulo)} <span class="chip azul">${L.esc(ROTULO_TIPO[r.tipo] || r.tipo)}</span></p>
                                ${r.arquivo_caminho
                                    ? `<p class="text-xs text-gray-600 truncate">${icone('anexo', 14)} ${L.esc(r.arquivo_nome || 'arquivo')}${r.arquivo_tamanho ? ' · ' + formatarTamanho(r.arquivo_tamanho) : ''}${r.permite_baixar === false ? ' · sem download' : ''}</p>`
                                    : `<a href="${L.esc(/^https?:\/\//i.test(r.url) ? r.url : '#')}" target="_blank" rel="noopener" class="text-blue-700 text-xs truncate block hover:underline">${L.esc(r.url)}</a>`}
                                ${r.descricao ? `<p class="text-xs text-gray-600 mt-0.5">${L.esc(r.descricao)}</p>` : ''}
                            </div>
                        </div>
                        <div class="flex gap-2 shrink-0">
                            <button onclick="editarRecurso('${r.id}')" class="inline-flex items-center gap-1.5 text-gray-600 hover:text-gray-900 text-sm font-bold px-3 py-2 rounded-lg bg-gray-100 hover:bg-gray-200">${icone('editar')} Editar</button>
                            <button onclick="excluirRecurso('${r.id}')" class="inline-flex items-center gap-1.5 text-red-700 hover:text-red-900 text-sm font-bold px-3 py-2 rounded-lg bg-red-50 hover:bg-red-100">${icone('excluir')} Excluir</button>
                        </div>
                    </div>`;
            }).join('');
        }
        document.getElementById('busca-recurso').addEventListener('input', () => renderizarRecursos());

        function mostrarFormulario(mostrar) {
            document.getElementById('form-novo').classList.toggle('hidden', !mostrar);
            document.getElementById('btn-novo-recurso').setAttribute('aria-expanded', String(mostrar));
            if (mostrar) document.getElementById('novo-titulo').focus();
        }
        document.getElementById('btn-novo-recurso').addEventListener('click', () => mostrarFormulario(document.getElementById('form-novo').classList.contains('hidden')));
        document.getElementById('btn-cancelar-recurso').addEventListener('click', () => { document.getElementById('form-novo').reset(); mostrarFormulario(false); });


        function modoNovo() { return document.querySelector('input[name="modo-novo"]:checked').value; }
        document.querySelectorAll('input[name="modo-novo"]').forEach((r) => r.addEventListener('change', () => {
            const arquivo = modoNovo() === 'arquivo';
            document.getElementById('bloco-arquivo-novo').classList.toggle('hidden', !arquivo);
            document.getElementById('bloco-link-novo').classList.toggle('hidden', arquivo);
        }));

        const campoArquivo = document.getElementById('novo-arquivo');
        const zona = document.getElementById('zona-novo');
        campoArquivo.addEventListener('change', () => {
            const arq = campoArquivo.files[0];
            const texto = document.getElementById('zona-texto-novo');
            if (!arq) { texto.textContent = 'Arraste o arquivo aqui ou clique para escolher'; return; }
            const problema = validarArquivo(arq);
            if (problema) { PibiexA11y.aviso(problema); campoArquivo.value = ''; texto.textContent = 'Arraste o arquivo aqui ou clique para escolher'; return; }
            texto.textContent = `${arq.name} · ${formatarTamanho(arq.size)}`;
            const titulo = document.getElementById('novo-titulo');
            if (!titulo.value.trim()) titulo.value = arq.name.replace(/\.[^.]+$/, '').replace(/[_]+/g, ' ');
        });
        ['dragenter', 'dragover'].forEach((ev) => zona.addEventListener(ev, (e) => { e.preventDefault(); zona.classList.add('arrastando'); }));
        ['dragleave', 'drop'].forEach((ev) => zona.addEventListener(ev, (e) => { e.preventDefault(); zona.classList.remove('arrastando'); }));
        zona.addEventListener('drop', (e) => {
            if (e.dataTransfer && e.dataTransfer.files.length) { campoArquivo.files = e.dataTransfer.files; campoArquivo.dispatchEvent(new Event('change')); }
        });

        document.getElementById('form-novo').addEventListener('submit', async (e) => {
            e.preventDefault();
            const titulo = document.getElementById('novo-titulo').value.trim();
            const tipo = document.getElementById('novo-tipo').value;
            const descricao = document.getElementById('novo-descricao').value.trim();
            const ordem = parseInt(document.getElementById('novo-ordem').value || '0', 10);
            if (!titulo) return;

            const dados = { titulo, tipo, descricao, ordem };
            const botao = e.submitter || e.target.querySelector('button[type="submit"]');
            try {
                if (modoNovo() === 'arquivo') {
                    const arquivo = campoArquivo.files[0];
                    if (!arquivo) { PibiexA11y.aviso('Escolha um arquivo para enviar.'); return; }
                    const problema = validarArquivo(arquivo);
                    if (problema) { PibiexA11y.aviso(problema); return; }
                    botao.disabled = true;
                    mostrarEnvio(`Enviando ${arquivo.name} (${formatarTamanho(arquivo.size)})…`);
                    Object.assign(dados, await enviarArquivo(arquivo), { permiteBaixar: document.getElementById('novo-baixar').checked });
                } else {
                    dados.url = document.getElementById('novo-url').value.trim();
                    if (!dados.url) { PibiexA11y.aviso('Cole o endereço do recurso.'); return; }
                }
                const resultado = await chamarGerenciarRecursos('criar', dados);
                if (resultado) {
                    document.getElementById('form-novo').reset();
                    document.getElementById('zona-texto-novo').textContent = 'Arraste o arquivo aqui ou clique para escolher';
                    document.querySelector('input[name="modo-novo"][value="arquivo"]').dispatchEvent(new Event('change'));
                    mostrarFormulario(false);
                    document.getElementById('novo-ordem').value = '0';
                    carregarRecursos();
                }
            } catch (erro) {
                PibiexA11y.aviso(erro.message || 'Erro ao salvar. Tente novamente.');
            } finally {
                mostrarEnvio('');
                if (botao) botao.disabled = false;
            }
        });

        window.editarRecurso = (id) => { idEmEdicao = id; carregarRecursos(); };
        window.cancelarEdicao = () => { idEmEdicao = null; carregarRecursos(); };

        window.salvarRecurso = async (recursoId) => {
            const titulo = document.getElementById(`edit-titulo-${recursoId}`).value.trim();
            const tipo = document.getElementById(`edit-tipo-${recursoId}`).value;
            const descricao = document.getElementById(`edit-descricao-${recursoId}`).value.trim();
            const ordem = parseInt(document.getElementById(`edit-ordem-${recursoId}`).value || '0', 10);
            if (!titulo) return;

            const dados = { recursoId, titulo, tipo, descricao, ordem };
            try {
                const campoUrl = document.getElementById(`edit-url-${recursoId}`);
                if (campoUrl) {
                    dados.url = campoUrl.value.trim();
                    if (!dados.url) return;
                } else {
                    dados.permiteBaixar = document.getElementById(`edit-baixar-${recursoId}`).checked;
                    const novo = document.getElementById(`edit-arquivo-${recursoId}`).files[0];
                    if (novo) {
                        const problema = validarArquivo(novo);
                        if (problema) { PibiexA11y.aviso(problema); return; }
                        PibiexA11y.aviso(`Enviando ${novo.name}…`);
                        Object.assign(dados, await enviarArquivo(novo));
                    }
                }
                const resultado = await chamarGerenciarRecursos('atualizar', dados);
                if (resultado) { idEmEdicao = null; carregarRecursos(); }
            } catch (erro) {
                PibiexA11y.aviso(erro.message || 'Erro ao salvar. Tente novamente.');
            }
        };

        window.excluirRecurso = async (recursoId) => {
            if (!(await PibiexA11y.confirmar('Excluir este recurso?'))) return;
            const resultado = await chamarGerenciarRecursos('excluir', { recursoId });
            if (resultado) carregarRecursos();
        };

        iniciarShellEquipe('recursos').then((sessao) => {
            if (!sessao) return;
            TOKEN_EQUIPE = sessao.token;
            carregarRecursos();
        });
    </script>
</body>
</html>
