<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafios Semanais · PIBIEX Digital</title>
    <link rel="stylesheet" href="/tailwind.css">
    <link rel="stylesheet" href="/pibiex-ui.css">
    <script src="/acessibilidade.js"></script>
    <script src="/painel-listas.js"></script>
    <link rel="stylesheet" href="/fonts/inter.css">
    <script src="/vendor/supabase/supabase.js"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="area-equipe flex min-h-screen bg-gray-50">

    <div id="sidebar-container"></div>

    <div class="flex-1 min-w-0">
        <div id="topo-pagina"></div>

        <main class="p-4 md:p-8 max-w-4xl mx-auto">
            <h1 class="text-2xl font-black text-gray-800 mb-1">Desafios Semanais</h1>
            <p class="text-gray-500 mb-6">Crie desafios com pontos, corrija os envios e acompanhe o ranking da turma.</p>

            <div id="seletor-turma" class="mb-6"></div>

            <div id="abas-principais" class="mb-6"></div>

            <!-- ===== Desafios e correção ===== -->
            <section id="painel-desafios">
                <div class="flex flex-wrap items-center gap-3 mb-4">
                    <input id="busca-desafio" type="search" class="caixa-busca" style="flex:1;min-width:200px" placeholder="Buscar desafio pelo título" aria-label="Buscar desafio pelo título" autocomplete="off">
                    <button type="button" id="btn-novo-desafio" aria-expanded="false" aria-controls="form-novo" class="bg-gray-900 hover:bg-gray-800 text-white font-bold px-5 py-2.5 rounded-xl text-sm">+ Novo desafio</button>
                </div>
                <div id="abas-desafios-filtro" class="mb-4"></div>

                <form id="form-novo" class="hidden bg-white rounded-2xl border border-gray-100 shadow-sm p-5 mb-6 space-y-3">
                    <div class="flex flex-wrap gap-3">
                        <div class="flex-1 min-w-[200px]">
                            <label class="block text-xs font-bold text-gray-500 mb-1">Título</label>
                            <input id="novo-titulo" required class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">
                        </div>
                        <div class="w-28">
                            <label class="block text-xs font-bold text-gray-500 mb-1">Semana</label>
                            <input id="novo-semana" type="number" min="1" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">
                        </div>
                        <div class="w-28">
                            <label class="block text-xs font-bold text-gray-500 mb-1">Vale pontos</label>
                            <input id="novo-pontos" type="number" min="1" max="1000" value="10" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">Descrição</label>
                        <textarea id="novo-descricao" required rows="3" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm"></textarea>
                    </div>
                    <div class="flex flex-wrap gap-3">
                        <div class="w-40">
                            <label class="block text-xs font-bold text-gray-500 mb-1">Prazo (opcional)</label>
                            <input id="novo-prazo" type="date" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">
                        </div>
                    </div>
                    <label class="flex items-center gap-2 text-sm text-gray-700">
                        <input type="checkbox" id="novo-ativo" checked class="rounded border-gray-300">
                        Visível para os alunos
                    </label>
                    <button type="submit" class="bg-gray-900 hover:bg-gray-800 text-white font-bold px-5 py-2 rounded-lg text-sm">Publicar desafio</button>
                    <button type="button" id="btn-cancelar-desafio" class="ml-2 text-sm font-bold text-gray-500 hover:text-gray-800 px-3 py-2">Cancelar</button>
                </form>

                <div id="lista-desafios" class="space-y-3">
                    <div class="skel" role="status" aria-label="Carregando"><i></i><i></i><i></i></div>
                </div>
            </section>

            <!-- ===== Ranking ===== -->
            <section id="painel-ranking" class="hidden">
                <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
                    <div id="abas-ranking"></div>
                    <input id="busca-ranking" type="search" class="caixa-busca" style="max-width:240px" placeholder="Buscar aluno" aria-label="Buscar aluno no ranking" autocomplete="off">
                </div>
                <div id="tabela-ranking">
                    <div class="skel" role="status" aria-label="Carregando"><i></i><i></i><i></i></div>
                </div>
            </section>
        </main>
    </div>

    <script src="shell.js"></script>
    <script>
        let TOKEN_EQUIPE = null;
        let TURMA_ATUAL = null;
        let idEmEdicao = null;
        let ABA = 'desafios';
        let SUB_ABA_RANKING = 'semana';
        let ULTIMO_RANKING = null;

        function formatarData(dataIso) {
            if (!dataIso) return '';
            return new Date(dataIso).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        function dataCurta(dataIso) {
            if (!dataIso) return '';
            const [ano, mes, dia] = dataIso.split('-');
            return `${dia}/${mes}/${ano}`;
        }

        async function chamarGerenciarDesafios(acao, dados) {
            const { data, error } = await window.supabaseClient.functions.invoke('gerenciar-desafios', {
                body: { tokenEquipe: TOKEN_EQUIPE, acao, ...dados },
            });
            if (error || !data || data.erro) {
                alert((data && data.erro) ? data.erro : 'Erro ao salvar. Tente novamente.');
                return null;
            }
            return data;
        }

        // ============================================================
        // Desafios e correção
        // ============================================================
        async function carregarDesafios() {
            if (!TURMA_ATUAL) return;
            const resultado = await chamarGerenciarDesafios('listar', { turmaId: TURMA_ATUAL });
            if (!resultado) {
                document.getElementById('lista-desafios').innerHTML = '<p class="text-red-500 text-sm">Erro ao carregar desafios.</p>';
                return;
            }
            renderizarDesafios(resultado.desafios || []);
            pintarAbas();
        }

        function linhaEnvio(e, desafio) {
            if (e.avaliado) {
                return `
                    <div class="px-5 py-3 border-t border-gray-100 flex items-start justify-between gap-3">
                        <div class="min-w-0 flex-1">
                            <p class="text-sm font-semibold text-gray-800">${escaparHtml(e.alunoNome)}</p>
                            <p class="text-[11px] text-gray-400">${formatarData(e.enviado_em)}</p>
                            <a href="${escaparHtml(urlSegura(e.link_ou_arquivo))}" target="_blank" rel="noopener" class="text-blue-600 text-xs font-semibold hover:underline">Abrir resposta →</a>
                            ${e.feedback ? `<p class="text-xs text-gray-600 mt-1 bg-gray-50 rounded px-2 py-1">${escaparHtml(e.feedback)}</p>` : ''}
                        </div>
                        <div class="text-right shrink-0">
                            <p class="text-sm font-black text-green-700">${e.pontos} / ${desafio.pontos} pts</p>
                            <button onclick="reabrirEnvio('${e.id}')" class="text-[11px] font-bold text-gray-400 hover:text-gray-700">Reabrir</button>
                        </div>
                    </div>
                `;
            }

            return `
                <div class="px-5 py-3 border-t border-gray-100">
                    <div class="flex items-start justify-between gap-3 mb-2">
                        <div class="min-w-0">
                            <p class="text-sm font-semibold text-gray-800">${escaparHtml(e.alunoNome)}</p>
                            <p class="text-[11px] text-gray-400">${formatarData(e.enviado_em)}</p>
                            <a href="${escaparHtml(urlSegura(e.link_ou_arquivo))}" target="_blank" rel="noopener" class="text-blue-600 text-xs font-semibold hover:underline">Abrir resposta →</a>
                        </div>
                        <span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded-full bg-amber-50 text-amber-700 shrink-0">Pendente</span>
                    </div>
                    <div class="flex flex-wrap items-end gap-2">
                        <div class="w-24">
                            <label class="block text-[10px] font-bold text-gray-500 mb-1">Nota (0–${desafio.pontos})</label>
                            <input type="number" id="nota-${e.id}" aria-label="Pontos deste envio" min="0" max="${desafio.pontos}" value="${desafio.pontos}"
                                   class="w-full border border-gray-200 rounded-lg px-2 py-1.5 text-sm">
                        </div>
                        <div class="flex-1 min-w-[160px]">
                            <label class="block text-[10px] font-bold text-gray-500 mb-1">Comentário (opcional)</label>
                            <input type="text" id="feedback-${e.id}" placeholder="Ex.: Ótimo, faltou explicar o passo 2"
                                   class="w-full border border-gray-200 rounded-lg px-2 py-1.5 text-sm">
                        </div>
                        <button onclick="avaliarEnvio('${e.id}')" class="bg-green-600 hover:bg-green-700 text-white text-xs font-bold px-3 py-2 rounded-lg shrink-0">
                            Dar nota
                        </button>
                    </div>
                </div>
            `;
        }

        const L = window.PibiexLista;
        let DESAFIOS = [];
        let FILTRO = 'todos';          // 'todos' | 'corrigir' | 'ativos' | 'inativos'
        let BUSCA = '';
        const ABERTOS = new Set();
        let PRIMEIRA_VEZ = true;

        function renderizarDesafios(desafios) {
            if (desafios) DESAFIOS = desafios;
            const container = document.getElementById('lista-desafios');

            if (DESAFIOS.length === 0) {
                document.getElementById('abas-desafios-filtro').innerHTML = '';
                container.innerHTML = '<div class="vazio-lista"><b>Nenhum desafio criado ainda</b>Clique em "+ Novo desafio" para publicar o primeiro.</div>';
                return;
            }

            // Primeira vez: já abre o desafio com mais envios esperando correção.
            if (PRIMEIRA_VEZ) {
                const alvo = DESAFIOS.slice().sort((x, y) => (y.pendentes || 0) - (x.pendentes || 0))[0];
                if (alvo && alvo.pendentes > 0) ABERTOS.add(alvo.id);
                PRIMEIRA_VEZ = false;
            }

            const termo = BUSCA.trim().toLowerCase();
            const base = DESAFIOS.filter((d) => !termo || (d.titulo || '').toLowerCase().includes(termo));
            const criterios = {
                todos: () => true,
                corrigir: (d) => (d.pendentes || 0) > 0,
                ativos: (d) => !!d.ativo,
                inativos: (d) => !d.ativo,
            };
            const n = (k) => base.filter(criterios[k]).length;
            L.abas(document.getElementById('abas-desafios-filtro'), [
                { id: 'todos', rotulo: 'Todos', n: base.length },
                { id: 'corrigir', rotulo: 'Com envios para corrigir', n: n('corrigir'), alerta: n('corrigir') > 0 },
                { id: 'ativos', rotulo: 'Visíveis', n: n('ativos') },
                { id: 'inativos', rotulo: 'Ocultos', n: n('inativos') },
            ], FILTRO, (id) => { FILTRO = id; renderizarDesafios(); });

            const lista = base.filter(criterios[FILTRO]);
            if (!lista.length) { container.innerHTML = '<div class="vazio-lista"><b>Nenhum desafio encontrado</b>Mude a busca ou o filtro.</div>'; return; }

            container.innerHTML = lista.map((d) => {
                if (idEmEdicao === d.id) {
                    return `
                        <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 space-y-2">
                            <input id="edit-titulo-${d.id}" value="${L.esc(d.titulo)}" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm font-bold">
                            <textarea id="edit-descricao-${d.id}" rows="3" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">${L.esc(d.descricao)}</textarea>
                            <div class="flex items-center gap-3 flex-wrap">
                                <input id="edit-semana-${d.id}" type="number" min="1" value="${d.semana ?? ''}" placeholder="Semana" class="w-28 border border-gray-200 rounded-lg px-3 py-2 text-sm">
                                <input id="edit-pontos-${d.id}" type="number" min="1" max="1000" value="${d.pontos}" placeholder="Pontos" class="w-28 border border-gray-200 rounded-lg px-3 py-2 text-sm">
                                <input id="edit-prazo-${d.id}" type="date" value="${d.data_fim ?? ''}" class="border border-gray-200 rounded-lg px-3 py-2 text-sm">
                                <label class="flex items-center gap-2 text-sm text-gray-700">
                                    <input type="checkbox" id="edit-ativo-${d.id}" class="rounded border-gray-300" ${d.ativo ? 'checked' : ''}>
                                    Visível para os alunos
                                </label>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="salvarDesafio('${d.id}')" class="bg-green-600 text-white text-xs font-bold px-3 py-2 rounded-lg">Salvar</button>
                                <button onclick="cancelarEdicao()" class="bg-gray-200 text-gray-700 text-xs font-bold px-3 py-2 rounded-lg">Cancelar</button>
                            </div>
                        </div>`;
                }

                const envios = d.envios || [];
                // Pendentes primeiro: é o que o professor precisa ver logo ao abrir.
                const ordenados = envios.slice().sort((a, b) => (a.avaliado === b.avaliado ? 0 : a.avaliado ? 1 : -1));
                const enviosHtml = ordenados.length === 0
                    ? '<p class="text-xs text-gray-500 px-5 py-4">Nenhum envio ainda.</p>'
                    : ordenados.map((e) => linhaEnvio(e, d)).join('');
                const pend = d.pendentes || 0;

                return `
                    <details class="cx" data-id="${L.esc(d.id)}" ${ABERTOS.has(d.id) ? 'open' : ''}>
                        <summary>
                            <span class="min-w-0 flex-1">
                                <span class="cx-titulo block">${L.esc(d.titulo)}</span>
                                <span class="flex flex-wrap gap-1.5 mt-2">
                                    ${d.semana ? `<span class="chip azul">Semana ${L.esc(d.semana)}</span>` : ''}
                                    <span class="chip ambar">${L.esc(d.pontos)} pts</span>
                                    ${d.data_fim ? `<span class="chip cinza">Prazo ${L.esc(dataCurta(d.data_fim))}</span>` : ''}
                                    ${!d.ativo ? '<span class="chip cinza">Oculto dos alunos</span>' : ''}
                                    <span class="chip ${pend ? 'vermelho' : envios.length ? 'verde' : 'cinza'}">${pend ? `${pend} para corrigir` : envios.length ? 'Tudo corrigido' : 'Sem envios'}</span>
                                    ${envios.length ? `<span class="chip cinza">${envios.length} ${envios.length === 1 ? 'envio' : 'envios'}</span>` : ''}
                                </span>
                            </span>
                        </summary>
                        <div>
                            <div class="px-5 py-4">
                                <p class="text-sm text-gray-700 whitespace-pre-wrap">${L.esc(d.descricao)}</p>
                                <div class="flex gap-2 mt-3">
                                    <button onclick="editarDesafio('${d.id}')" class="inline-flex items-center gap-1.5 text-gray-600 hover:text-gray-900 text-sm font-bold px-3 py-2 rounded-lg bg-gray-100 hover:bg-gray-200">${icone('editar')} Editar</button>
                                    <button onclick="excluirDesafio('${d.id}')" class="inline-flex items-center gap-1.5 text-red-700 hover:text-red-900 text-sm font-bold px-3 py-2 rounded-lg bg-red-50 hover:bg-red-100">${icone('excluir')} Excluir</button>
                                </div>
                            </div>
                            <div class="bg-gray-50 px-5 py-2 border-t border-gray-100">
                                <p class="text-xs font-bold text-gray-500 uppercase">Envios (${envios.length})</p>
                            </div>
                            ${enviosHtml}
                        </div>
                    </details>`;
            }).join('');

            container.querySelectorAll('details.cx').forEach((det) => {
                det.addEventListener('toggle', () => { if (det.open) ABERTOS.add(det.dataset.id); else ABERTOS.delete(det.dataset.id); });
            });
        }

        document.getElementById('busca-desafio').addEventListener('input', (e) => { BUSCA = e.target.value; renderizarDesafios(); });

        function mostrarFormulario(mostrar) {
            document.getElementById('form-novo').classList.toggle('hidden', !mostrar);
            document.getElementById('btn-novo-desafio').setAttribute('aria-expanded', String(mostrar));
            if (mostrar) document.getElementById('novo-titulo').focus();
        }
        document.getElementById('btn-novo-desafio').addEventListener('click', () => mostrarFormulario(document.getElementById('form-novo').classList.contains('hidden')));
        document.getElementById('btn-cancelar-desafio').addEventListener('click', () => { document.getElementById('form-novo').reset(); mostrarFormulario(false); });

        document.getElementById('form-novo').addEventListener('submit', async (e) => {
            e.preventDefault();
            const titulo = document.getElementById('novo-titulo').value.trim();
            const descricao = document.getElementById('novo-descricao').value.trim();
            const semanaBruta = document.getElementById('novo-semana').value;
            const semana = semanaBruta ? parseInt(semanaBruta, 10) : null;
            const pontos = parseInt(document.getElementById('novo-pontos').value, 10) || 10;
            const dataFim = document.getElementById('novo-prazo').value || null;
            const ativo = document.getElementById('novo-ativo').checked;
            if (!titulo || !descricao) return;

            const resultado = await chamarGerenciarDesafios('criar', { titulo, descricao, semana, pontos, dataFim, ativo });
            if (resultado) {
                document.getElementById('form-novo').reset();
                document.getElementById('novo-pontos').value = 10;
                document.getElementById('novo-ativo').checked = true;
                mostrarFormulario(false);
                carregarDesafios();
            }
        });

        window.editarDesafio = (id) => { idEmEdicao = id; carregarDesafios(); };
        window.cancelarEdicao = () => { idEmEdicao = null; carregarDesafios(); };

        window.salvarDesafio = async (desafioId) => {
            const titulo = document.getElementById(`edit-titulo-${desafioId}`).value.trim();
            const descricao = document.getElementById(`edit-descricao-${desafioId}`).value.trim();
            const semanaBruta = document.getElementById(`edit-semana-${desafioId}`).value;
            const semana = semanaBruta ? parseInt(semanaBruta, 10) : null;
            const pontos = parseInt(document.getElementById(`edit-pontos-${desafioId}`).value, 10) || 10;
            const dataFim = document.getElementById(`edit-prazo-${desafioId}`).value || null;
            const ativo = document.getElementById(`edit-ativo-${desafioId}`).checked;
            if (!titulo || !descricao) return;

            const resultado = await chamarGerenciarDesafios('atualizar', { desafioId, titulo, descricao, semana, pontos, dataFim, ativo });
            if (resultado) { idEmEdicao = null; carregarDesafios(); }
        };

        window.excluirDesafio = async (desafioId) => {
            if (!(await PibiexA11y.confirmar('Excluir este desafio e todos os envios dos alunos? Essa ação não pode ser desfeita.'))) return;
            const resultado = await chamarGerenciarDesafios('excluir', { desafioId });
            if (resultado) carregarDesafios();
        };

        window.avaliarEnvio = async (envioId) => {
            const pontos = document.getElementById(`nota-${envioId}`).value;
            const feedback = document.getElementById(`feedback-${envioId}`).value.trim();
            if (pontos === '') { alert('Informe a nota.'); return; }

            const resultado = await chamarGerenciarDesafios('avaliar', { envioId, pontos: Number(pontos), feedback: feedback || null });
            if (resultado) carregarDesafios();
        };

        window.reabrirEnvio = async (envioId) => {
            if (!(await PibiexA11y.confirmar('Reabrir este envio? A nota some e ele volta para a fila de correção.'))) return;
            const resultado = await chamarGerenciarDesafios('reabrir_envio', { envioId });
            if (resultado) carregarDesafios();
        };

        // ============================================================
        // Ranking
        // ============================================================
        async function carregarRanking() {
            if (!TURMA_ATUAL) return;
            const tabela = document.getElementById('tabela-ranking');
            tabela.innerHTML = '<div class="skel" role="status" aria-label="Carregando"><i></i><i></i><i></i></div>';

            const resultado = await chamarGerenciarDesafios('ranking', { turmaId: TURMA_ATUAL });
            if (!resultado) { tabela.innerHTML = '<p class="text-red-500 text-sm p-5">Erro ao carregar o ranking.</p>'; return; }

            ULTIMO_RANKING = resultado;
            renderizarRanking();
        }

        function renderizarRanking() {
            const tabela = document.getElementById('tabela-ranking');
            if (!ULTIMO_RANKING) return;

            L.abas(document.getElementById('abas-ranking'), [
                { id: 'semana', rotulo: 'Esta semana', n: (ULTIMO_RANKING.semana || []).length },
                { id: 'geral', rotulo: 'Geral', n: (ULTIMO_RANKING.geral || []).length },
            ], SUB_ABA_RANKING, (id) => { SUB_ABA_RANKING = id; renderizarRanking(); });

            const todas = SUB_ABA_RANKING === 'semana' ? ULTIMO_RANKING.semana : ULTIMO_RANKING.geral;
            const semNinguem = todas.every((l) => l.pontos === 0);
            const termo = document.getElementById('busca-ranking').value.trim().toLowerCase();
            const linhas = todas.filter((l) => !termo || (l.nome || '').toLowerCase().includes(termo));

            if (todas.length === 0) {
                tabela.innerHTML = '<div class="vazio-lista"><b>Nenhum aluno nesta turma ainda</b></div>';
                return;
            }
            if (linhas.length === 0) {
                tabela.innerHTML = '<div class="vazio-lista"><b>Nenhum aluno com esse nome</b></div>';
                return;
            }

            // Top 3 em dourado, prata e bronze (sem emoji); os demais em cinza.
            const corPosicao = { 1: 'background:#FEF3C7;color:#92400E', 2: 'background:#E5E7EB;color:#374151', 3: 'background:#FFEDD5;color:#9A3412' };

            tabela.innerHTML = `
                <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
                ${semNinguem ? '<p class="text-xs text-amber-700 bg-amber-50 px-5 py-2">Ninguém pontuou ainda nesta visão.</p>' : ''}
                <div class="divide-y divide-gray-100">
                    ${linhas.map((l) => `
                        <div class="px-5 py-3 flex items-center justify-between gap-3 ${l.pontos === 0 ? 'opacity-60' : ''}">
                            <div class="flex items-center gap-3 min-w-0">
                                <span class="w-8 h-8 rounded-full inline-flex items-center justify-center text-xs font-black text-gray-600 bg-gray-100 shrink-0" style="${corPosicao[l.posicao] || ''}">${l.posicao}º</span>
                                <p class="text-sm font-semibold text-gray-800 truncate">${L.esc(l.nome)}</p>
                            </div>
                            <div class="text-right shrink-0">
                                <p class="text-sm font-black text-gray-800">${l.pontos} pts</p>
                                <p class="text-[11px] text-gray-500">${l.desafiosFeitos} ${l.desafiosFeitos === 1 ? 'desafio' : 'desafios'}</p>
                            </div>
                        </div>`).join('')}
                </div></div>`;
        }
        document.getElementById('busca-ranking').addEventListener('input', renderizarRanking);

        // ============================================================
        // Abas principais
        // ============================================================
        function pintarAbas() {
            L.abas(document.getElementById('abas-principais'), [
                { id: 'desafios', rotulo: 'Desafios e correção', n: DESAFIOS.length, alerta: DESAFIOS.some((d) => (d.pendentes || 0) > 0) },
                { id: 'ranking', rotulo: 'Ranking', n: ULTIMO_RANKING ? (ULTIMO_RANKING.geral || []).length : '' },
            ], ABA, (id) => trocarAba(id));
        }

        window.trocarAba = (aba) => {
            ABA = aba;
            pintarAbas();
            document.getElementById('painel-desafios').classList.toggle('hidden', aba !== 'desafios');
            document.getElementById('painel-ranking').classList.toggle('hidden', aba !== 'ranking');
            if (aba === 'ranking') carregarRanking();
        };

        // ============================================================
        // Início
        // ============================================================
        iniciarShellEquipe('desafios').then(async (sessao) => {
            if (!sessao) return;
            TOKEN_EQUIPE = sessao.token;
            pintarAbas();

            TURMA_ATUAL = await montarSeletorTurma('seletor-turma', (turmaId) => {
                TURMA_ATUAL = turmaId;
                idEmEdicao = null; ABERTOS.clear(); PRIMEIRA_VEZ = true;
                if (ABA === 'desafios') carregarDesafios();
                else carregarRanking();
            });

            if (!TURMA_ATUAL) {
                document.getElementById('lista-desafios').innerHTML = '';
                return;
            }

            carregarDesafios();
        });
    </script>
</body>
</html>
