<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIBIEX Digital · FAQ</title>
    <link rel="stylesheet" href="/tailwind.css">
    <link rel="stylesheet" href="/pibiex-ui.css">
    <script src="/acessibilidade.js"></script>
    <script src="/painel-listas.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="/vendor/supabase/supabase.js"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="flex min-h-screen bg-gray-50">

    <div id="sidebar-container"></div>

    <div class="flex-1 min-w-0">
        <div id="topo-pagina"></div>

        <main class="p-4 md:p-8 max-w-4xl mx-auto">
            <h1 class="text-2xl font-black text-gray-800 mb-1">Gerenciar FAQ</h1>
            <p class="text-gray-500 mb-6">Perguntas e respostas exibidas na área do aluno. Itens inativos ficam ocultos.</p>

            <div class="flex flex-wrap items-center gap-3 mb-4">
                <input id="busca-faq" type="search" class="caixa-busca" style="flex:1;min-width:200px" placeholder="Buscar pergunta ou resposta" aria-label="Buscar pergunta ou resposta" autocomplete="off">
                <button type="button" id="btn-nova-pergunta" aria-expanded="false" aria-controls="form-novo" class="bg-gray-900 hover:bg-gray-800 text-white font-bold px-5 py-2.5 rounded-xl text-sm">+ Nova pergunta</button>
            </div>
            <div id="abas-faq" class="mb-4"></div>

            <form id="form-novo" class="hidden bg-white rounded-2xl border border-gray-100 shadow-sm p-5 mb-6 space-y-3">
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">Pergunta</label>
                    <input id="novo-pergunta" required class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">Resposta</label>
                    <textarea id="novo-resposta" required rows="3" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm"></textarea>
                </div>
                <div class="flex items-end gap-3 flex-wrap">
                    <div class="w-24">
                        <label class="block text-xs font-bold text-gray-500 mb-1">Ordem</label>
                        <input id="novo-ordem" type="number" value="0" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">
                    </div>
                    <label class="flex items-center gap-2 text-sm text-gray-700 pb-2">
                        <input type="checkbox" id="novo-ativo" checked class="rounded border-gray-300">
                        Visível para os alunos
                    </label>
                </div>
                <button type="submit" class="bg-gray-900 hover:bg-gray-800 text-white font-bold px-5 py-2 rounded-lg text-sm">Publicar pergunta</button>
                <button type="button" id="btn-cancelar-pergunta" class="ml-2 text-sm font-bold text-gray-500 hover:text-gray-800 px-3 py-2">Cancelar</button>
            </form>

            <div id="lista-faq" class="space-y-3">
                <div class="skel" role="status" aria-label="Carregando"><i></i><i></i><i></i></div>
            </div>
        </main>
    </div>

    <script src="shell.js"></script>
    <script>
        let TOKEN_EQUIPE = null;
        let idEmEdicao = null;

        function escaparHtml(texto) {
            const div = document.createElement('div');
            div.innerText = texto ?? '';
            return div.innerHTML;
        }

        async function chamarGerenciarFaq(acao, dados) {
            const { data, error } = await window.supabaseClient.functions.invoke('gerenciar-faq', {
                body: { tokenEquipe: TOKEN_EQUIPE, acao, ...dados },
            });
            if (error || !data || data.erro) {
                alert((data && data.erro) ? data.erro : 'Erro ao salvar. Tente novamente.');
                return null;
            }
            return data;
        }

        async function carregarFaq() {
            const resultado = await chamarGerenciarFaq('listar', {});
            if (!resultado) {
                document.getElementById('lista-faq').innerHTML = '<p class="text-red-500 text-sm">Erro ao carregar o FAQ.</p>';
                return;
            }
            renderizarFaq(resultado.faqs || []);
        }

        const L = window.PibiexLista;
        let FAQS = [];
        let FILTRO = 'todos';
        const ABERTOS = new Set();

        function renderizarFaq(faqs) {
            if (faqs) FAQS = faqs;
            const container = document.getElementById('lista-faq');

            if (FAQS.length === 0) {
                document.getElementById('abas-faq').innerHTML = '';
                container.innerHTML = '<div class="vazio-lista"><b>Nenhuma pergunta cadastrada ainda</b>Clique em "+ Nova pergunta" para cadastrar a primeira.</div>';
                return;
            }

            const termo = document.getElementById('busca-faq').value.trim().toLowerCase();
            const base = FAQS.filter((f) => !termo || (f.pergunta || '').toLowerCase().includes(termo) || (f.resposta || '').toLowerCase().includes(termo));
            L.abas(document.getElementById('abas-faq'), [
                { id: 'todos', rotulo: 'Todas', n: base.length },
                { id: 'ativos', rotulo: 'Visíveis', n: base.filter((f) => f.ativo).length },
                { id: 'inativos', rotulo: 'Ocultas', n: base.filter((f) => !f.ativo).length },
            ], FILTRO, (id) => { FILTRO = id; renderizarFaq(); });

            const lista = base.filter((f) => FILTRO === 'todos' || (FILTRO === 'ativos' ? f.ativo : !f.ativo));
            if (!lista.length) { container.innerHTML = '<div class="vazio-lista"><b>Nenhuma pergunta encontrada</b>Mude a busca ou o filtro.</div>'; return; }

            container.innerHTML = lista.map((f) => {
                if (idEmEdicao === f.id) {
                    return `
                        <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 space-y-2">
                            <input id="edit-pergunta-${f.id}" value="${L.esc(f.pergunta)}" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm font-bold" aria-label="Pergunta">
                            <textarea id="edit-resposta-${f.id}" rows="3" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm" aria-label="Resposta">${L.esc(f.resposta)}</textarea>
                            <div class="flex items-center gap-3 flex-wrap">
                                <input id="edit-ordem-${f.id}" type="number" value="${f.ordem ?? 0}" class="w-24 border border-gray-200 rounded-lg px-3 py-2 text-sm" aria-label="Ordem">
                                <label class="flex items-center gap-2 text-sm text-gray-700">
                                    <input type="checkbox" id="edit-ativo-${f.id}" class="rounded border-gray-300" ${f.ativo ? 'checked' : ''}>
                                    Visível para os alunos
                                </label>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="salvarFaq('${f.id}')" class="bg-green-600 text-white text-xs font-bold px-3 py-2 rounded-lg">Salvar</button>
                                <button onclick="cancelarEdicao()" class="bg-gray-200 text-gray-700 text-xs font-bold px-3 py-2 rounded-lg">Cancelar</button>
                            </div>
                        </div>`;
                }
                return `
                    <details class="cx" data-id="${L.esc(f.id)}" ${ABERTOS.has(f.id) ? 'open' : ''}>
                        <summary>
                            <span class="min-w-0 flex-1">
                                <span class="cx-titulo block">${L.esc(f.pergunta)}</span>
                                <span class="flex flex-wrap gap-1.5 mt-1.5">
                                    ${!f.ativo ? '<span class="chip cinza">Oculta dos alunos</span>' : ''}
                                    <span class="chip cinza">Ordem ${f.ordem ?? 0}</span>
                                </span>
                            </span>
                        </summary>
                        <div class="cx-corpo">
                            <p class="text-sm text-gray-700 whitespace-pre-wrap">${L.esc(f.resposta)}</p>
                            <div class="flex flex-wrap gap-2 mt-3">
                                <button onclick="editarFaq('${f.id}')" class="inline-flex items-center gap-1.5 text-gray-600 hover:text-gray-900 text-sm font-bold px-3 py-2 rounded-lg bg-gray-100 hover:bg-gray-200">${icone('editar')} Editar</button>
                                <button onclick="excluirFaq('${f.id}')" class="inline-flex items-center gap-1.5 text-red-700 hover:text-red-900 text-sm font-bold px-3 py-2 rounded-lg bg-red-50 hover:bg-red-100">${icone('excluir')} Excluir</button>
                            </div>
                        </div>
                    </details>`;
            }).join('');

            container.querySelectorAll('details.cx').forEach((det) => {
                det.addEventListener('toggle', () => { if (det.open) ABERTOS.add(det.dataset.id); else ABERTOS.delete(det.dataset.id); });
            });
        }
        document.getElementById('busca-faq').addEventListener('input', () => renderizarFaq());

        function mostrarFormulario(mostrar) {
            document.getElementById('form-novo').classList.toggle('hidden', !mostrar);
            document.getElementById('btn-nova-pergunta').setAttribute('aria-expanded', String(mostrar));
            if (mostrar) document.getElementById('novo-pergunta').focus();
        }
        document.getElementById('btn-nova-pergunta').addEventListener('click', () => mostrarFormulario(document.getElementById('form-novo').classList.contains('hidden')));
        document.getElementById('btn-cancelar-pergunta').addEventListener('click', () => { document.getElementById('form-novo').reset(); mostrarFormulario(false); });


        document.getElementById('form-novo').addEventListener('submit', async (e) => {
            e.preventDefault();
            const pergunta = document.getElementById('novo-pergunta').value.trim();
            const resposta = document.getElementById('novo-resposta').value.trim();
            const ordem = parseInt(document.getElementById('novo-ordem').value || '0', 10);
            const ativo = document.getElementById('novo-ativo').checked;
            if (!pergunta || !resposta) return;

            const resultado = await chamarGerenciarFaq('criar', { pergunta, resposta, ordem, ativo });
            if (resultado) {
                document.getElementById('form-novo').reset();
                mostrarFormulario(false);
                document.getElementById('novo-ordem').value = '0';
                document.getElementById('novo-ativo').checked = true;
                carregarFaq();
            }
        });

        window.editarFaq = (id) => { idEmEdicao = id; carregarFaq(); };
        window.cancelarEdicao = () => { idEmEdicao = null; carregarFaq(); };

        window.salvarFaq = async (faqId) => {
            const pergunta = document.getElementById(`edit-pergunta-${faqId}`).value.trim();
            const resposta = document.getElementById(`edit-resposta-${faqId}`).value.trim();
            const ordem = parseInt(document.getElementById(`edit-ordem-${faqId}`).value || '0', 10);
            const ativo = document.getElementById(`edit-ativo-${faqId}`).checked;
            if (!pergunta || !resposta) return;

            const resultado = await chamarGerenciarFaq('atualizar', { faqId, pergunta, resposta, ordem, ativo });
            if (resultado) { idEmEdicao = null; carregarFaq(); }
        };

        window.excluirFaq = async (faqId) => {
            if (!confirm('Excluir esta pergunta?')) return;
            const resultado = await chamarGerenciarFaq('excluir', { faqId });
            if (resultado) carregarFaq();
        };

        iniciarShellEquipe('faq').then((sessao) => {
            if (!sessao) return;
            TOKEN_EQUIPE = sessao.token;
            carregarFaq();
        });
    </script>
</body>
</html>
