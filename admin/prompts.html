<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIBIEX Digital · Banco de Prompts</title>
    <link rel="stylesheet" href="/tailwind.css">
    <link rel="stylesheet" href="/pibiex-ui.css">
    <script src="/acessibilidade.js"></script>
    <script src="/painel-listas.js"></script>
    <link rel="stylesheet" href="/fonts/inter.css">
    <script src="/vendor/supabase/supabase.js"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="flex min-h-screen bg-gray-50">

    <div id="sidebar-container"></div>

    <div class="flex-1 min-w-0">
        <div id="topo-pagina"></div>

        <main class="p-4 md:p-8 max-w-4xl mx-auto">
            <h1 class="text-2xl font-black text-gray-800 mb-1">Banco de Prompts</h1>
            <p class="text-gray-500 mb-6">Cadastre prompts prontos para os alunos copiarem. Prompts não públicos ficam ocultos na área do aluno.</p>

            <div class="flex flex-wrap items-center gap-3 mb-4">
                <input id="busca-prompt" type="search" class="caixa-busca" style="flex:1;min-width:200px" placeholder="Buscar prompt pelo título ou conteúdo" aria-label="Buscar prompt pelo título ou conteúdo" autocomplete="off">
                <button type="button" id="btn-novo-prompt" aria-expanded="false" aria-controls="form-novo" class="bg-gray-900 hover:bg-gray-800 text-white font-bold px-5 py-2.5 rounded-xl text-sm">+ Novo prompt</button>
            </div>
            <div id="abas-prompts" class="mb-4"></div>

            <form id="form-novo" class="hidden bg-white rounded-2xl border border-gray-100 shadow-sm p-5 mb-6 space-y-3">
                <div class="flex flex-wrap gap-3">
                    <div class="flex-1 min-w-[200px]">
                        <label class="block text-xs font-bold text-gray-500 mb-1">Título</label>
                        <input id="novo-titulo" required class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">
                    </div>
                    <div class="w-56">
                        <label class="block text-xs font-bold text-gray-500 mb-1">Categoria</label>
                        <input id="novo-categoria" required placeholder="ex: Estudos" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">Conteúdo do prompt</label>
                    <textarea id="novo-conteudo" required rows="3" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm font-mono"></textarea>
                </div>
                <label class="flex items-center gap-2 text-sm text-gray-700">
                    <input type="checkbox" id="novo-publico" checked class="rounded border-gray-300">
                    Visível para os alunos
                </label>
                <button type="submit" class="bg-gray-900 hover:bg-gray-800 text-white font-bold px-5 py-2 rounded-lg text-sm">Publicar prompt</button>
                <button type="button" id="btn-cancelar-prompt" class="ml-2 text-sm font-bold text-gray-500 hover:text-gray-800 px-3 py-2">Cancelar</button>
            </form>

            <div id="lista-prompts" class="space-y-3">
                <div class="skel" role="status" aria-label="Carregando"><i></i><i></i><i></i></div>
            </div>
        </main>
    </div>

    <script src="shell.js"></script>
    <script>
        let TOKEN_EQUIPE = null;
        let idEmEdicao = null;

        function escaparHtml(texto) {
            const div = document.createElement('div');
            div.innerText = texto ?? '';
            return div.innerHTML;
        }

        async function chamarGerenciarPrompts(acao, dados) {
            const { data, error } = await window.supabaseClient.functions.invoke('gerenciar-prompts', {
                body: { tokenEquipe: TOKEN_EQUIPE, acao, ...dados },
            });
            if (error || !data || data.erro) {
                alert((data && data.erro) ? data.erro : 'Erro ao salvar. Tente novamente.');
                return null;
            }
            return data;
        }

        async function carregarPrompts() {
            const resultado = await chamarGerenciarPrompts('listar', {});
            if (!resultado) {
                document.getElementById('lista-prompts').innerHTML = '<p class="text-red-500 text-sm">Erro ao carregar prompts.</p>';
                return;
            }
            renderizarPrompts(resultado.prompts || []);
        }

        const L = window.PibiexLista;
        let PROMPTS = [];
        let FILTRO = 'todos';          // 'todos' | 'oculto' | nome da categoria
        const ABERTOS = new Set();

        function renderizarPrompts(prompts) {
            if (prompts) PROMPTS = prompts;
            const container = document.getElementById('lista-prompts');

            if (PROMPTS.length === 0) {
                document.getElementById('abas-prompts').innerHTML = '';
                container.innerHTML = '<div class="vazio-lista"><b>Nenhum prompt cadastrado ainda</b>Clique em "+ Novo prompt" para cadastrar o primeiro.</div>';
                return;
            }

            const termo = document.getElementById('busca-prompt').value.trim().toLowerCase();
            const base = PROMPTS.filter((p) => !termo || (p.titulo || '').toLowerCase().includes(termo) || (p.conteudo || '').toLowerCase().includes(termo));
            const categorias = [...new Set(PROMPTS.map((p) => p.categoria).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'pt-BR'));
            if (FILTRO !== 'todos' && FILTRO !== 'oculto' && !categorias.includes(FILTRO)) FILTRO = 'todos';
            const ocultos = base.filter((p) => !p.publico).length;
            L.abas(document.getElementById('abas-prompts'), [{ id: 'todos', rotulo: 'Todos', n: base.length }]
                .concat(categorias.map((c) => ({ id: c, rotulo: c, n: base.filter((p) => p.categoria === c).length })))
                .concat(ocultos ? [{ id: 'oculto', rotulo: 'Ocultos', n: ocultos }] : []),
                FILTRO, (id) => { FILTRO = id; renderizarPrompts(); });

            const lista = base.filter((p) => FILTRO === 'todos' || (FILTRO === 'oculto' ? !p.publico : p.categoria === FILTRO));
            if (!lista.length) { container.innerHTML = '<div class="vazio-lista"><b>Nenhum prompt encontrado</b>Mude a busca ou a categoria.</div>'; return; }

            container.innerHTML = lista.map((p) => {
                if (idEmEdicao === p.id) {
                    return `
                        <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 space-y-2">
                            <input id="edit-titulo-${p.id}" value="${L.esc(p.titulo)}" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm font-bold" aria-label="Título">
                            <input id="edit-categoria-${p.id}" value="${L.esc(p.categoria)}" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm" aria-label="Categoria">
                            <textarea id="edit-conteudo-${p.id}" rows="3" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm font-mono" aria-label="Conteúdo">${L.esc(p.conteudo)}</textarea>
                            <label class="flex items-center gap-2 text-sm text-gray-700">
                                <input type="checkbox" id="edit-publico-${p.id}" class="rounded border-gray-300" ${p.publico ? 'checked' : ''}>
                                Visível para os alunos
                            </label>
                            <div class="flex gap-2">
                                <button onclick="salvarPrompt('${p.id}')" class="bg-green-600 text-white text-xs font-bold px-3 py-2 rounded-lg">Salvar</button>
                                <button onclick="cancelarEdicao()" class="bg-gray-200 text-gray-700 text-xs font-bold px-3 py-2 rounded-lg">Cancelar</button>
                            </div>
                        </div>`;
                }
                return `
                    <details class="cx" data-id="${L.esc(p.id)}" ${ABERTOS.has(p.id) ? 'open' : ''}>
                        <summary>
                            <span class="min-w-0 flex-1">
                                <span class="cx-titulo block">${L.esc(p.titulo)}</span>
                                <span class="flex flex-wrap gap-1.5 mt-1.5">
                                    <span class="chip azul">${L.esc(p.categoria)}</span>
                                    ${!p.publico ? '<span class="chip cinza">Oculto dos alunos</span>' : ''}
                                </span>
                                <span class="cx-previa font-mono">${L.esc(p.conteudo)}</span>
                            </span>
                        </summary>
                        <div class="cx-corpo">
                            <p class="text-xs text-gray-800 font-mono whitespace-pre-wrap bg-gray-50 rounded-lg p-3">${L.esc(p.conteudo)}</p>
                            <div class="flex flex-wrap gap-2 mt-3">
                                <button onclick="copiarPrompt('${p.id}', this)" class="border border-gray-200 bg-white hover:bg-gray-50 text-gray-700 text-sm font-bold px-3 py-2 rounded-lg">Copiar texto</button>
                                <button onclick="editarPrompt('${p.id}')" class="inline-flex items-center gap-1.5 text-gray-600 hover:text-gray-900 text-sm font-bold px-3 py-2 rounded-lg bg-gray-100 hover:bg-gray-200">${icone('editar')} Editar</button>
                                <button onclick="excluirPrompt('${p.id}')" class="inline-flex items-center gap-1.5 text-red-700 hover:text-red-900 text-sm font-bold px-3 py-2 rounded-lg bg-red-50 hover:bg-red-100">${icone('excluir')} Excluir</button>
                            </div>
                        </div>
                    </details>`;
            }).join('');

            container.querySelectorAll('details.cx').forEach((det) => {
                det.addEventListener('toggle', () => { if (det.open) ABERTOS.add(det.dataset.id); else ABERTOS.delete(det.dataset.id); });
            });
        }

        window.copiarPrompt = (id, botao) => {
            const p = PROMPTS.find((x) => x.id === id);
            if (!p) return;
            navigator.clipboard.writeText(p.conteudo).then(() => { botao.textContent = 'Copiado!'; setTimeout(() => { botao.textContent = 'Copiar texto'; }, 1500); });
        };
        document.getElementById('busca-prompt').addEventListener('input', () => renderizarPrompts());

        function mostrarFormulario(mostrar) {
            document.getElementById('form-novo').classList.toggle('hidden', !mostrar);
            document.getElementById('btn-novo-prompt').setAttribute('aria-expanded', String(mostrar));
            if (mostrar) document.getElementById('novo-titulo').focus();
        }
        document.getElementById('btn-novo-prompt').addEventListener('click', () => mostrarFormulario(document.getElementById('form-novo').classList.contains('hidden')));
        document.getElementById('btn-cancelar-prompt').addEventListener('click', () => { document.getElementById('form-novo').reset(); mostrarFormulario(false); });


        document.getElementById('form-novo').addEventListener('submit', async (e) => {
            e.preventDefault();
            const titulo = document.getElementById('novo-titulo').value.trim();
            const categoria = document.getElementById('novo-categoria').value.trim();
            const conteudo = document.getElementById('novo-conteudo').value.trim();
            const publico = document.getElementById('novo-publico').checked;
            if (!titulo || !categoria || !conteudo) return;

            const resultado = await chamarGerenciarPrompts('criar', { titulo, categoria, conteudo, publico });
            if (resultado) {
                document.getElementById('form-novo').reset();
                document.getElementById('novo-publico').checked = true;
                mostrarFormulario(false);
                carregarPrompts();
            }
        });

        window.editarPrompt = (id) => { idEmEdicao = id; carregarPrompts(); };
        window.cancelarEdicao = () => { idEmEdicao = null; carregarPrompts(); };

        window.salvarPrompt = async (promptId) => {
            const titulo = document.getElementById(`edit-titulo-${promptId}`).value.trim();
            const categoria = document.getElementById(`edit-categoria-${promptId}`).value.trim();
            const conteudo = document.getElementById(`edit-conteudo-${promptId}`).value.trim();
            const publico = document.getElementById(`edit-publico-${promptId}`).checked;
            if (!titulo || !categoria || !conteudo) return;

            const resultado = await chamarGerenciarPrompts('atualizar', { promptId, titulo, categoria, conteudo, publico });
            if (resultado) { idEmEdicao = null; carregarPrompts(); }
        };

        window.excluirPrompt = async (promptId) => {
            if (!confirm('Excluir este prompt?')) return;
            const resultado = await chamarGerenciarPrompts('excluir', { promptId });
            if (resultado) carregarPrompts();
        };

        iniciarShellEquipe('prompts').then((sessao) => {
            if (!sessao) return;
            TOKEN_EQUIPE = sessao.token;
            carregarPrompts();
        });
    </script>
</body>
</html>
