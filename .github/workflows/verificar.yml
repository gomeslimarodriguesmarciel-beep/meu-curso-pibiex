name: Verificar site

on:
  push:
    branches: [main]
  pull_request:

jobs:
  estatico:
    name: Verificações do código
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/testes/verificar.mjs
      - run: node tools/testes/demo.mjs

  navegador:
    name: Testes no navegador (sem dados reais)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/testes/fluxos.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
