<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIBIEX Digital · Atividades</title>
    <link rel="stylesheet" href="/tailwind.css">
    <link rel="stylesheet" href="/pibiex-ui.css">
    <script src="/acessibilidade.js"></script>
    <script src="/painel-listas.js"></script>
    <link rel="stylesheet" href="/fonts/inter.css">
    <script src="/vendor/supabase/supabase.js"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="flex min-h-screen bg-gray-50">

    <div id="sidebar-container"></div>

    <div class="flex-1 min-w-0">
        <div id="topo-pagina"></div>

        <main class="p-4 md:p-8 max-w-4xl mx-auto">
            <h1 class="text-2xl font-black text-gray-800 mb-1">Gerenciar Atividades</h1>
            <p class="text-gray-500 mb-6">Crie atividades com prazo, vinculadas a um módulo. Isso aparece na área do aluno.</p>

            <div id="seletor-turma" class="mb-5"></div>

            <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
                <div id="abas-atividades"></div>
                <button type="button" id="btn-nova" aria-expanded="false" aria-controls="form-nova-atividade"
                        class="bg-gray-900 hover:bg-gray-800 text-white font-bold px-5 py-2.5 rounded-xl text-sm">+ Nova atividade</button>
            </div>

            <form id="form-nova-atividade" class="hidden bg-white rounded-2xl border border-gray-100 shadow-sm p-5 mb-6 space-y-3">
                <div class="flex flex-wrap gap-3">
                    <div class="flex-1 min-w-[200px]">
                        <label class="block text-xs font-bold text-gray-500 mb-1">Módulo</label>
                        <select id="nova-modulo" required class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm"></select>
                    </div>
                    <div class="flex-1 min-w-[200px]">
                        <label class="block text-xs font-bold text-gray-500 mb-1">Título</label>
                        <input id="nova-titulo" required class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">
                    </div>
                    <div class="w-56">
                        <label class="block text-xs font-bold text-gray-500 mb-1">Prazo (opcional)</label>
                        <input id="nova-prazo" type="datetime-local" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">
                    </div>
                    <div class="w-32">
                        <label class="block text-xs font-bold text-gray-500 mb-1">Vale horas (opcional)</label>
                        <input id="nova-horas" type="number" min="0" step="0.5" placeholder="ex: 2" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">Descrição / enunciado (opcional)</label>
                    <textarea id="nova-descricao" rows="2" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm"></textarea>
                </div>
                <button type="submit" class="bg-gray-900 hover:bg-gray-800 text-white font-bold px-5 py-2 rounded-lg text-sm">Publicar atividade</button>
                <button type="button" id="btn-cancelar-nova" class="ml-2 text-sm font-bold text-gray-500 hover:text-gray-800 px-3 py-2">Cancelar</button>
            </form>

            <input id="busca-atividade" type="search" class="caixa-busca mb-4" placeholder="Buscar atividade pelo título" aria-label="Buscar atividade pelo título">

            <div id="lista-atividades" class="space-y-3">
                <div class="skel" role="status" aria-label="Carregando"><i></i><i></i><i></i></div>
            </div>
        </main>
    </div>

    <script src="shell.js"></script>
    <script>
        let TOKEN_EQUIPE = null;
        let TURMA_ATUAL = null;
        let MODULOS = [];
        let idEmEdicao = null;

        function formatarPrazo(dataIso) {
            if (!dataIso) return null;
            return new Date(dataIso).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        function paraDatetimeLocal(dataIso) {
            if (!dataIso) return '';
            const d = new Date(dataIso);
            const pad = (n) => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }

        function opcoesModulo(selecionado) {
            return MODULOS.map(m => `<option value="${m.id}" ${m.id === selecionado ? 'selected' : ''}>${escaparHtml(m.titulo)}</option>`).join('');
        }

        async function chamarGerenciarAtividades(acao, dados) {
            const { data, error } = await window.supabaseClient.functions.invoke('gerenciar-atividades', {
                body: { tokenEquipe: TOKEN_EQUIPE, acao, ...dados },
            });
            if (error || !data || data.erro) {
                alert((data && data.erro) ? data.erro : 'Erro ao salvar. Tente novamente.');
                return null;
            }
            return data;
        }

        let ATIVIDADES = [];
        let CONTAGEM = {};            // atividade_id -> { total, pendentes }
        let FILTRO = 'todas';         // 'todas' | 'abertas' | 'encerradas'
        let BUSCA = '';
        let ABERTA = null;
        const L = window.PibiexLista;
        const esc = L.esc;

        const encerrada = (a) => !!a.data_entrega && new Date(a.data_entrega) < new Date();

        async function carregarAtividades() {
            const { data, error } = await window.supabaseClient
                .from('atividades')
                .select('id, titulo, descricao, data_entrega, horas_maximas, modulo_id, criado_em, modulos(titulo, turma_id)')
                .order('criado_em', { ascending: false });

            if (error) {
                document.getElementById('lista-atividades').innerHTML = '<p class="text-red-500 text-sm">Erro ao carregar atividades.</p>';
                console.error(error);
                return;
            }

            ATIVIDADES = (data || []).filter(a => a.modulos && a.modulos.turma_id === TURMA_ATUAL);

            // quantos envios cada atividade recebeu (e quantos ainda faltam corrigir)
            CONTAGEM = {};
            if (ATIVIDADES.length) {
                const { data: envios } = await window.supabaseClient
                    .from('trabalhos_enviados')
                    .select('atividade_id, status')
                    .in('atividade_id', ATIVIDADES.map(a => a.id));
                (envios || []).forEach((e) => {
                    const c = CONTAGEM[e.atividade_id] || (CONTAGEM[e.atividade_id] = { total: 0, pendentes: 0 });
                    c.total++;
                    if (e.status !== 'avaliado') c.pendentes++;
                });
            }
            desenharTudo();
        }

        function desenharTudo() {
            const abertas = ATIVIDADES.filter(a => !encerrada(a)).length;
            L.abas(document.getElementById('abas-atividades'), [
                { id: 'todas', rotulo: 'Todas', n: ATIVIDADES.length },
                { id: 'abertas', rotulo: 'Abertas', n: abertas },
                { id: 'encerradas', rotulo: 'Encerradas', n: ATIVIDADES.length - abertas },
            ], FILTRO, (id) => { FILTRO = id; desenharTudo(); });
            renderizarAtividades();
        }

        function renderizarAtividades() {
            const container = document.getElementById('lista-atividades');
            const termo = BUSCA.trim().toLowerCase();
            const atividades = ATIVIDADES
                .filter(a => FILTRO === 'todas' || (FILTRO === 'abertas' ? !encerrada(a) : encerrada(a)))
                .filter(a => !termo || (a.titulo || '').toLowerCase().includes(termo));

            if (ATIVIDADES.length === 0) {
                container.innerHTML = '<div class="vazio-lista"><b>Nenhuma atividade criada ainda</b>Clique em "+ Nova atividade" para publicar a primeira.</div>';
                return;
            }
            if (atividades.length === 0) {
                container.innerHTML = '<div class="vazio-lista"><b>Nenhuma atividade encontrada</b>Mude a aba ou a busca.</div>';
                return;
            }

            container.innerHTML = atividades.map((atv) => {
                const editando = idEmEdicao === atv.id;

                if (editando) {
                    return `
                        <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 space-y-2">
                            <select id="edit-modulo-${atv.id}" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">${opcoesModulo(atv.modulo_id)}</select>
                            <input id="edit-titulo-${atv.id}" value="${esc(atv.titulo)}" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm font-bold">
                            <textarea id="edit-descricao-${atv.id}" rows="2" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">${esc(atv.descricao || '')}</textarea>
                            <input id="edit-prazo-${atv.id}" type="datetime-local" value="${paraDatetimeLocal(atv.data_entrega)}" class="border border-gray-200 rounded-lg px-3 py-2 text-sm">
                            <input id="edit-horas-${atv.id}" type="number" min="0" step="0.5" placeholder="Vale horas (opcional)" value="${atv.horas_maximas ?? ''}" class="w-40 border border-gray-200 rounded-lg px-3 py-2 text-sm">
                            <div class="flex gap-2">
                                <button onclick="salvarAtividade('${atv.id}')" class="bg-green-600 text-white text-xs font-bold px-3 py-2 rounded-lg">Salvar</button>
                                <button onclick="cancelarEdicao()" class="bg-gray-200 text-gray-700 text-xs font-bold px-3 py-2 rounded-lg">Cancelar</button>
                            </div>
                        </div>
                    `;
                }

                const pz = L.prazo(atv.data_entrega);
                const c = CONTAGEM[atv.id] || { total: 0, pendentes: 0 };
                return `
                    <details class="cx" ${ABERTA === atv.id ? 'open' : ''} data-id="${atv.id}">
                        <summary>
                            <span class="min-w-0 flex-1">
                                <span class="cx-titulo block">${esc(atv.titulo)}</span>
                                <span class="cx-sub block">${atv.modulos ? esc(atv.modulos.titulo) : ''} · criada ${esc(L.tempo(atv.criado_em))}</span>
                                <span class="flex flex-wrap gap-1.5 mt-2">
                                    <span class="chip ${pz.estado === 'passou' ? 'vermelho' : pz.estado === 'perto' ? 'ambar' : pz.estado === 'ok' ? 'azul' : 'cinza'}">${esc(pz.texto)}</span>
                                    ${atv.horas_maximas ? `<span class="chip ambar">Vale até ${esc(atv.horas_maximas)}h</span>` : ''}
                                    <span class="chip ${c.pendentes ? 'ambar' : c.total ? 'verde' : 'cinza'}">${c.total ? `${c.total} ${c.total === 1 ? 'envio' : 'envios'}${c.pendentes ? ` · ${c.pendentes} p/ corrigir` : ' · tudo corrigido'}` : 'Nenhum envio'}</span>
                                </span>
                            </span>
                        </summary>
                        <div class="cx-corpo">
                            ${atv.descricao ? `<p class="text-sm text-gray-700 whitespace-pre-wrap mb-4">${esc(atv.descricao)}</p>` : '<p class="text-sm text-gray-500 mb-4">Sem enunciado.</p>'}
                            <div class="flex flex-wrap items-center gap-2">
                                <a href="trabalhos.html?atividade=${atv.id}" class="bg-gray-900 hover:bg-gray-800 text-white text-sm font-bold px-4 py-2 rounded-lg">${c.pendentes ? `Corrigir (${c.pendentes})` : 'Ver envios'}</a>
                                <button onclick="editarAtividade('${atv.id}')" class="inline-flex items-center gap-1.5 text-gray-600 hover:text-gray-900 text-sm font-bold px-3 py-2 rounded-lg bg-gray-100 hover:bg-gray-200">${icone('editar')} Editar</button>
                                <button onclick="excluirAtividade('${atv.id}')" class="inline-flex items-center gap-1.5 text-red-700 hover:text-red-900 text-sm font-bold px-3 py-2 rounded-lg bg-red-50 hover:bg-red-100">${icone('excluir')} Excluir</button>
                            </div>
                        </div>
                    </details>
                `;
            }).join('');

            container.querySelectorAll('details.cx').forEach((d) => {
                d.addEventListener('toggle', () => { if (d.open) ABERTA = d.dataset.id; else if (ABERTA === d.dataset.id) ABERTA = null; });
            });
        }

        document.getElementById('busca-atividade').addEventListener('input', (e) => { BUSCA = e.target.value; renderizarAtividades(); });

        function mostrarFormulario(mostrar) {
            const f = document.getElementById('form-nova-atividade');
            f.classList.toggle('hidden', !mostrar);
            document.getElementById('btn-nova').setAttribute('aria-expanded', String(mostrar));
            if (mostrar) document.getElementById('nova-titulo').focus();
        }
        document.getElementById('btn-nova').addEventListener('click', () => mostrarFormulario(document.getElementById('form-nova-atividade').classList.contains('hidden')));
        document.getElementById('btn-cancelar-nova').addEventListener('click', () => { document.getElementById('form-nova-atividade').reset(); mostrarFormulario(false); });

        document.getElementById('form-nova-atividade').addEventListener('submit', async (e) => {
            e.preventDefault();
            const moduloId = document.getElementById('nova-modulo').value;
            const titulo = document.getElementById('nova-titulo').value.trim();
            const descricao = document.getElementById('nova-descricao').value.trim();
            const prazoLocal = document.getElementById('nova-prazo').value;
            const dataEntrega = prazoLocal ? new Date(prazoLocal).toISOString() : null;
            const horasTexto = document.getElementById('nova-horas').value.trim();
            const horasMaximas = horasTexto === '' ? null : Number(horasTexto);
            if (!moduloId || !titulo) return;

            const resultado = await chamarGerenciarAtividades('criar', { moduloId, titulo, descricao, dataEntrega, horasMaximas });
            if (resultado) {
                document.getElementById('form-nova-atividade').reset();
                mostrarFormulario(false);
                carregarAtividades();
            }
        });

        window.editarAtividade = (id) => { idEmEdicao = id; carregarAtividades(); };
        window.cancelarEdicao = () => { idEmEdicao = null; carregarAtividades(); };

        window.salvarAtividade = async (atividadeId) => {
            const titulo = document.getElementById(`edit-titulo-${atividadeId}`).value.trim();
            const descricao = document.getElementById(`edit-descricao-${atividadeId}`).value.trim();
            const prazoLocal = document.getElementById(`edit-prazo-${atividadeId}`).value;
            const dataEntrega = prazoLocal ? new Date(prazoLocal).toISOString() : null;
            const horasTexto = document.getElementById(`edit-horas-${atividadeId}`).value.trim();
            const horasMaximas = horasTexto === '' ? null : Number(horasTexto);
            if (!titulo) return;

            const resultado = await chamarGerenciarAtividades('atualizar', { atividadeId, titulo, descricao, dataEntrega, horasMaximas });
            if (resultado) { idEmEdicao = null; carregarAtividades(); }
        };

        window.excluirAtividade = async (atividadeId) => {
            if (!(await PibiexA11y.confirmar('Excluir esta atividade?'))) return;
            const resultado = await chamarGerenciarAtividades('excluir', { atividadeId });
            if (resultado) carregarAtividades();
        };

        iniciarShellEquipe('atividades').then(async (sessao) => {
            if (!sessao) return;
            TOKEN_EQUIPE = sessao.token;

            TURMA_ATUAL = await montarSeletorTurma('seletor-turma', (turmaId) => {
                TURMA_ATUAL = turmaId;
                idEmEdicao = null;
                carregarTurma();
            });

            if (!TURMA_ATUAL) {
                document.getElementById('lista-atividades').innerHTML = '';
                return;
            }

            carregarTurma();
        });

        // Os módulos são próprios de cada turma, então trocar de turma exige
        // recarregar tanto o menu de módulos do formulário quanto as atividades.
        async function carregarTurma() {
            const lista = document.getElementById('lista-atividades');
            lista.innerHTML = '<div class="skel" role="status" aria-label="Carregando"><i></i><i></i><i></i></div>';

            const { data: modulos } = await window.supabaseClient.from('modulos').select('id, titulo').eq('turma_id', TURMA_ATUAL).order('ordem', { ascending: true });
            MODULOS = modulos || [];
            document.getElementById('nova-modulo').innerHTML = opcoesModulo(null);

            if (MODULOS.length === 0) {
                lista.innerHTML = '<p class="text-amber-600 text-sm bg-amber-50 rounded-xl p-5 border border-amber-100">Crie um módulo na página Cronograma antes de adicionar atividades.</p>';
                return;
            }

            carregarAtividades();
        }
    </script>
</body>
</html>
