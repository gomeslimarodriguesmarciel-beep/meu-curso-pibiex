<!DOCTYPE html>
<!-- Fonte do cartão de compartilhamento (1200x630) usado nas prévias de link (WhatsApp, redes).
     Para refazer a imagem: abra esta página num navegador com 1200x630 e salve a captura em img/cartao-compartilhamento.png -->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Cartão de compartilhamento</title>
<link rel="stylesheet" href="/fonts/inter.css">
<style>
    * { box-sizing: border-box; margin: 0; }
    body { width: 1200px; height: 630px; font-family: 'Inter', sans-serif; color: #fff; overflow: hidden;
        background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(135deg, #0B1B4A 0%, #1E3A8A 50%, #1E40AF 100%);
        background-size: 40px 40px, 40px 40px, 100% 100%; position: relative; }
    .halo { position: absolute; right: -120px; top: -140px; width: 620px; height: 620px; background: radial-gradient(closest-side, rgba(163,230,53,.38), transparent 70%); }
    .conteudo { position: absolute; left: 80px; top: 0; bottom: 0; width: 640px; display: flex; flex-direction: column; justify-content: center; }
    .selo { align-self: flex-start; font-size: 20px; font-weight: 800; letter-spacing: .02em; color: #DBEAFE; border: 2px solid rgba(255,255,255,.25); border-radius: 999px; padding: 8px 20px; margin-bottom: 34px; }
    .selo b { color: #A3E635; }
    h1 { font-size: 66px; line-height: 1.04; font-weight: 900; letter-spacing: -.01em; margin-bottom: 28px; }
    p { font-size: 28px; line-height: 1.4; color: rgba(219,234,254,.92); font-weight: 500; }
    .rodape { position: absolute; left: 80px; bottom: 46px; font-size: 24px; font-weight: 800; color: #A3E635; }
    .logo { position: absolute; right: 70px; top: 50%; transform: translateY(-50%); width: 400px; filter: drop-shadow(0 20px 30px rgba(0,0,0,.4)); }
</style>
</head>
<body>
    <div class="halo"></div>
    <div class="conteudo">
        <span class="selo"><b>●</b> Curso de Inteligência Artificial</span>
        <h1>A plataforma que organiza o curso.</h1>
        <p>Aulas, atividades, desafios e frequência, com Libras e proteção de dados.</p>
    </div>
    <img class="logo" src="/logo-pibiex-digital-branca.png" alt="">
    <div class="rodape">pibiexdigital.com.br</div>
</body>
</html>
