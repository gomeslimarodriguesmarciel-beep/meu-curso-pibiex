<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferramentas de IA · PIBIEX Digital</title>
    <link rel="stylesheet" href="/tailwind.css">
    <link rel="stylesheet" href="/pibiex-ui.css">
    <script src="/acessibilidade.js"></script>
    <script src="/painel-listas.js"></script>
    <link rel="stylesheet" href="/fonts/inter.css">
    <script src="/vendor/supabase/supabase.js"></script>
    <script src="/simulacao.js"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="flex min-h-screen">

    <div id="sidebar-container"></div>

    <div class="flex-1 min-w-0">
        <div id="topo-pagina"></div>

        <main class="p-4 md:p-9 max-w-5xl mx-auto">
            <h1 class="fonte-display text-2xl font-semibold mb-1" style="color: var(--pibiex-texto);">Ferramentas de IA</h1>
            <p class="text-sm mb-7" style="color: var(--pibiex-texto-suave);">Um panorama das principais ferramentas de IA usadas no curso, organizadas por categoria.</p>

            <input id="busca-ferramenta" type="search" class="caixa-busca mb-4" placeholder="Buscar ferramenta pelo nome ou descrição" aria-label="Buscar ferramenta" autocomplete="off">
            <div id="abas-ferramentas" class="mb-6"></div>
            <div id="lista-ferramentas" class="space-y-8 pt-4">
                <div class="skel" role="status" aria-label="Carregando"><i></i><i></i><i></i></div>
            </div>
        </main>
    </div>

    <div id="assistente-flutuante"></div>

    <script src="shell.js"></script>
    <script>
        function escaparHtml(texto) {
            const div = document.createElement('div');
            div.innerText = texto ?? '';
            return div.innerHTML;
        }
        function urlSegura(url) {
            return /^https?:\/\//i.test(url ?? '') ? url : '#';
        }

        function agruparPorCategoria(ferramentas) {
            const grupos = {};
            ferramentas.forEach(f => {
                if (!grupos[f.categoria]) grupos[f.categoria] = [];
                grupos[f.categoria].push(f);
            });
            return grupos;
        }

        const L = window.PibiexLista;
        let TODAS = [];
        let FILTRO = 'todas';

        function renderizar(dados) {
            if (dados) TODAS = dados;
            const container = document.getElementById('lista-ferramentas');
            const termo = document.getElementById('busca-ferramenta').value.trim().toLowerCase();
            const base = TODAS.filter((f) => !termo || (f.nome || '').toLowerCase().includes(termo) || (f.descricao || '').toLowerCase().includes(termo));
            const categorias = [...new Set(TODAS.map((f) => f.categoria))];
            if (FILTRO !== 'todas' && !categorias.includes(FILTRO)) FILTRO = 'todas';
            L.abas(document.getElementById('abas-ferramentas'), categorias.length > 1 ? [{ id: 'todas', rotulo: 'Todas', n: base.length }]
                .concat(categorias.map((c) => ({ id: c, rotulo: c, n: base.filter((f) => f.categoria === c).length }))) : [],
                FILTRO, (id) => { FILTRO = id; renderizar(); });
            const ferramentas = base.filter((f) => FILTRO === 'todas' || f.categoria === FILTRO);
            if (TODAS.length && ferramentas.length === 0) {
                container.innerHTML = '<div class="vazio-lista"><b>Nenhuma ferramenta encontrada</b>Mude a busca ou a categoria.</div>';
                return;
            }

            if (!ferramentas || ferramentas.length === 0) {
                container.innerHTML = `<p class="text-sm bg-white rounded-lg p-5 border" style="color: var(--pibiex-texto-suave); border-color: var(--pibiex-borda);">Nenhuma ferramenta cadastrada ainda.</p>`;
                return;
            }

            const grupos = agruparPorCategoria(ferramentas);

            container.innerHTML = Object.keys(grupos).map((categoria) => `
                <section>
                    <p class="text-[11px] font-bold uppercase tracking-[0.12em] mb-3" style="color: var(--pibiex-texto-suave);">${escaparHtml(categoria)}</p>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                        ${grupos[categoria].map(f => `
                            <a href="${escaparHtml(urlSegura(f.url || '#'))}" target="_blank" rel="noopener"
                               class="bg-white rounded-lg p-4 border hover:shadow-sm transition block" style="border-color: var(--pibiex-borda);">
                                <p class="font-semibold text-[14.5px] mb-1" style="color: var(--pibiex-texto);">${escaparHtml(f.nome)}</p>
                                <p class="text-xs" style="color: var(--pibiex-texto-suave);">${escaparHtml(f.descricao || '')}</p>
                            </a>
                        `).join('')}
                    </div>
                </section>
            `).join('');
        }

        async function carregar() {
            const { data, error } = await window.supabaseClient
                .from('ferramentas_ia')
                .select('id, nome, categoria, descricao, url, ordem')
                .eq('ativo', true)
                .order('ordem', { ascending: true });

            if (error) {
                document.getElementById('lista-ferramentas').innerHTML =
                    `<p class="text-sm text-red-600 bg-white rounded-lg p-5 border border-red-100">Não foi possível carregar as ferramentas.</p>`;
                console.error(error);
                return;
            }
            renderizar(data);
        }
        document.getElementById('busca-ferramenta').addEventListener('input', () => renderizar());

        iniciarShellAluno('ferramentas-ia').then((dados) => {
            if (dados) carregar();
        });
    </script>
</body>
</html>
