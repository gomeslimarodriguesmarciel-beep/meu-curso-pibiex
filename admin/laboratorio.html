<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratório de IA · PIBIEX Digital</title>
    <link rel="stylesheet" href="/tailwind.css">
    <link rel="stylesheet" href="/pibiex-ui.css">
    <script src="/acessibilidade.js"></script>
    <script src="/painel-listas.js"></script>
    <link rel="stylesheet" href="/fonts/inter.css">
    <script src="/vendor/supabase/supabase.js"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="area-equipe flex min-h-screen bg-gray-50">

    <div id="sidebar-container"></div>

    <div class="flex-1 min-w-0">
        <div id="topo-pagina"></div>

        <main class="p-4 md:p-8 max-w-4xl mx-auto">
            <h1 class="text-2xl font-black text-gray-800 mb-1">Laboratório de IA</h1>
            <p class="text-gray-500 mb-6">Crie problemas práticos e acompanhe as soluções enviadas pelos alunos.</p>

            <div class="flex flex-wrap items-center gap-3 mb-4">
                <input id="busca-lab" type="search" class="caixa-busca" style="flex:1;min-width:200px" placeholder="Buscar problema pelo título" aria-label="Buscar problema pelo título" autocomplete="off">
                <button type="button" id="btn-novo-lab" aria-expanded="false" aria-controls="form-novo" class="bg-gray-900 hover:bg-gray-800 text-white font-bold px-5 py-2.5 rounded-xl text-sm">+ Novo problema</button>
            </div>
            <div id="abas-lab" class="mb-4"></div>

            <form id="form-novo" class="hidden bg-white rounded-2xl border border-gray-100 shadow-sm p-5 mb-6 space-y-3">
                <div class="flex flex-wrap gap-3">
                    <div class="flex-1 min-w-[200px]">
                        <label class="block text-xs font-bold text-gray-500 mb-1">Título</label>
                        <input id="novo-titulo" required class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">
                    </div>
                    <div class="w-40">
                        <label class="block text-xs font-bold text-gray-500 mb-1">Dificuldade</label>
                        <select id="novo-dificuldade" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">
                            <option value="facil">Fácil</option>
                            <option value="medio" selected>Médio</option>
                            <option value="dificil">Difícil</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">Problema</label>
                    <textarea id="novo-problema" required rows="3" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">Instruções (opcional)</label>
                    <textarea id="novo-instrucoes" rows="2" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm"></textarea>
                </div>
                <label class="flex items-center gap-2 text-sm text-gray-700">
                    <input type="checkbox" id="novo-ativo" checked class="rounded border-gray-300">
                    Visível para os alunos
                </label>
                <button type="submit" class="bg-gray-900 hover:bg-gray-800 text-white font-bold px-5 py-2 rounded-lg text-sm">Publicar problema</button>
                <button type="button" id="btn-cancelar-lab" class="ml-2 text-sm font-bold text-gray-500 hover:text-gray-800 px-3 py-2">Cancelar</button>
            </form>

            <div id="lista-laboratorio" class="space-y-3">
                <div class="skel" role="status" aria-label="Carregando"><i></i><i></i><i></i></div>
            </div>
        </main>
    </div>

    <script src="shell.js"></script>
    <script>
        let TOKEN_EQUIPE = null;
        let idEmEdicao = null;

        const ROTULO_DIFICULDADE = { facil: 'Fácil', medio: 'Médio', dificil: 'Difícil' };
        const COR_DIFICULDADE = { facil: 'bg-green-50 text-green-700', medio: 'bg-amber-50 text-amber-700', dificil: 'bg-red-50 text-red-700' };

        function escaparHtml(texto) {
            const div = document.createElement('div');
            div.innerText = texto ?? '';
            return div.innerHTML;
        }

        function formatarData(dataIso) {
            if (!dataIso) return '';
            return new Date(dataIso).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        function opcoesDificuldade(selecionada) {
            return Object.entries(ROTULO_DIFICULDADE)
                .map(([valor, rotulo]) => `<option value="${valor}" ${valor === selecionada ? 'selected' : ''}>${rotulo}</option>`)
                .join('');
        }

        async function chamarGerenciarLaboratorio(acao, dados) {
            const { data, error } = await window.supabaseClient.functions.invoke('gerenciar-laboratorio', {
                body: { tokenEquipe: TOKEN_EQUIPE, acao, ...dados },
            });
            if (error || !data || data.erro) {
                alert((data && data.erro) ? data.erro : 'Erro ao salvar. Tente novamente.');
                return null;
            }
            return data;
        }

        async function carregarLaboratorio() {
            const resultado = await chamarGerenciarLaboratorio('listar', {});
            if (!resultado) {
                document.getElementById('lista-laboratorio').innerHTML = '<p class="text-red-500 text-sm">Erro ao carregar o laboratório.</p>';
                return;
            }
            renderizarLaboratorio(resultado.laboratorios || []);
        }

        const L = window.PibiexLista;
        let LABS = [];
        let FILTRO = 'todos';          // 'todos' | 'envios' | 'ativos' | 'inativos'
        let BUSCA = '';
        const ABERTOS = new Set();

        function renderizarLaboratorio(laboratorios) {
            if (laboratorios) LABS = laboratorios;
            const container = document.getElementById('lista-laboratorio');

            if (LABS.length === 0) {
                document.getElementById('abas-lab').innerHTML = '';
                container.innerHTML = '<div class="vazio-lista"><b>Nenhum problema criado ainda</b>Clique em "+ Novo problema" para publicar o primeiro.</div>';
                return;
            }

            const termo = BUSCA.trim().toLowerCase();
            const base = LABS.filter((l) => !termo || (l.titulo || '').toLowerCase().includes(termo));
            const criterios = {
                todos: () => true,
                envios: (l) => (l.envios || []).length > 0,
                ativos: (l) => !!l.ativo,
                inativos: (l) => !l.ativo,
            };
            const n = (k) => base.filter(criterios[k]).length;
            L.abas(document.getElementById('abas-lab'), [
                { id: 'todos', rotulo: 'Todos', n: base.length },
                { id: 'envios', rotulo: 'Com envios', n: n('envios') },
                { id: 'ativos', rotulo: 'Visíveis', n: n('ativos') },
                { id: 'inativos', rotulo: 'Ocultos', n: n('inativos') },
            ], FILTRO, (id) => { FILTRO = id; renderizarLaboratorio(); });

            const lista = base.filter(criterios[FILTRO]);
            if (!lista.length) { container.innerHTML = '<div class="vazio-lista"><b>Nenhum problema encontrado</b>Mude a busca ou o filtro.</div>'; return; }

            container.innerHTML = lista.map((lab) => {
                if (idEmEdicao === lab.id) {
                    return `
                        <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 space-y-2">
                            <input id="edit-titulo-${lab.id}" value="${L.esc(lab.titulo)}" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm font-bold" aria-label="Título">
                            <textarea id="edit-problema-${lab.id}" rows="3" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm" aria-label="Problema">${L.esc(lab.problema)}</textarea>
                            <textarea id="edit-instrucoes-${lab.id}" rows="2" placeholder="Instruções (opcional)" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm" aria-label="Instruções">${L.esc(lab.instrucoes || '')}</textarea>
                            <div class="flex items-center gap-3 flex-wrap">
                                <select id="edit-dificuldade-${lab.id}" class="border border-gray-200 rounded-lg px-3 py-2 text-sm" aria-label="Dificuldade">${opcoesDificuldade(lab.dificuldade)}</select>
                                <label class="flex items-center gap-2 text-sm text-gray-700">
                                    <input type="checkbox" id="edit-ativo-${lab.id}" class="rounded border-gray-300" ${lab.ativo ? 'checked' : ''}>
                                    Visível para os alunos
                                </label>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="salvarLaboratorio('${lab.id}')" class="bg-green-600 text-white text-xs font-bold px-3 py-2 rounded-lg">Salvar</button>
                                <button onclick="cancelarEdicao()" class="bg-gray-200 text-gray-700 text-xs font-bold px-3 py-2 rounded-lg">Cancelar</button>
                            </div>
                        </div>`;
                }

                const envios = lab.envios || [];
                const enviosHtml = envios.length === 0
                    ? '<p class="text-xs text-gray-500 px-5 py-4">Nenhum envio ainda.</p>'
                    : envios.map((e) => `
                        <div class="px-5 py-3 border-t border-gray-100">
                            <div class="flex items-center justify-between gap-3">
                                <div class="min-w-0">
                                    <p class="text-sm font-semibold text-gray-800">${L.esc(e.alunoNome)}</p>
                                    <p class="text-[11px] text-gray-500">${L.esc(formatarData(e.enviado_em))}</p>
                                </div>
                                ${e.arquivo_url ? `<a href="${L.esc(urlSegura(e.arquivo_url))}" target="_blank" rel="noopener" class="text-blue-700 text-xs font-semibold hover:underline shrink-0">Abrir arquivo &rarr;</a>` : ''}
                            </div>
                            ${e.resposta_texto ? `<p class="text-xs text-gray-700 bg-gray-50 rounded-lg p-2.5 mt-2 whitespace-pre-wrap">${L.esc(e.resposta_texto)}</p>` : ''}
                        </div>`).join('');

                return `
                    <details class="cx" data-id="${L.esc(lab.id)}" ${ABERTOS.has(lab.id) ? 'open' : ''}>
                        <summary>
                            <span class="min-w-0 flex-1">
                                <span class="cx-titulo block">${L.esc(lab.titulo)}</span>
                                <span class="flex flex-wrap gap-1.5 mt-2">
                                    ${lab.dificuldade ? `<span class="chip ${lab.dificuldade === 'facil' ? 'verde' : lab.dificuldade === 'dificil' ? 'vermelho' : 'ambar'}">${L.esc(ROTULO_DIFICULDADE[lab.dificuldade] || lab.dificuldade)}</span>` : ''}
                                    ${!lab.ativo ? '<span class="chip cinza">Oculto dos alunos</span>' : ''}
                                    <span class="chip ${envios.length ? 'azul' : 'cinza'}">${envios.length ? `${envios.length} ${envios.length === 1 ? 'envio' : 'envios'}` : 'Sem envios'}</span>
                                </span>
                            </span>
                        </summary>
                        <div>
                            <div class="px-5 py-4">
                                <p class="text-sm text-gray-700 whitespace-pre-wrap">${L.esc(lab.problema)}</p>
                                ${lab.instrucoes ? `<p class="text-xs text-gray-600 italic mt-2 whitespace-pre-wrap">${L.esc(lab.instrucoes)}</p>` : ''}
                                <div class="flex gap-2 mt-3">
                                    <button onclick="editarLaboratorio('${lab.id}')" class="inline-flex items-center gap-1.5 text-gray-600 hover:text-gray-900 text-sm font-bold px-3 py-2 rounded-lg bg-gray-100 hover:bg-gray-200">${icone('editar')} Editar</button>
                                    <button onclick="excluirLaboratorio('${lab.id}')" class="inline-flex items-center gap-1.5 text-red-700 hover:text-red-900 text-sm font-bold px-3 py-2 rounded-lg bg-red-50 hover:bg-red-100">${icone('excluir')} Excluir</button>
                                </div>
                            </div>
                            <div class="bg-gray-50 px-5 py-2 border-t border-gray-100">
                                <p class="text-xs font-bold text-gray-500 uppercase">Envios (${envios.length})</p>
                            </div>
                            ${enviosHtml}
                        </div>
                    </details>`;
            }).join('');

            container.querySelectorAll('details.cx').forEach((det) => {
                det.addEventListener('toggle', () => { if (det.open) ABERTOS.add(det.dataset.id); else ABERTOS.delete(det.dataset.id); });
            });
        }

        document.getElementById('busca-lab').addEventListener('input', (e) => { BUSCA = e.target.value; renderizarLaboratorio(); });

        function mostrarFormulario(mostrar) {
            document.getElementById('form-novo').classList.toggle('hidden', !mostrar);
            document.getElementById('btn-novo-lab').setAttribute('aria-expanded', String(mostrar));
            if (mostrar) document.getElementById('novo-titulo').focus();
        }
        document.getElementById('btn-novo-lab').addEventListener('click', () => mostrarFormulario(document.getElementById('form-novo').classList.contains('hidden')));
        document.getElementById('btn-cancelar-lab').addEventListener('click', () => { document.getElementById('form-novo').reset(); mostrarFormulario(false); });

        document.getElementById('form-novo').addEventListener('submit', async (e) => {
            e.preventDefault();
            const titulo = document.getElementById('novo-titulo').value.trim();
            const problema = document.getElementById('novo-problema').value.trim();
            const instrucoes = document.getElementById('novo-instrucoes').value.trim();
            const dificuldade = document.getElementById('novo-dificuldade').value;
            const ativo = document.getElementById('novo-ativo').checked;
            if (!titulo || !problema) return;

            const resultado = await chamarGerenciarLaboratorio('criar', { titulo, problema, instrucoes, dificuldade, ativo });
            if (resultado) {
                document.getElementById('form-novo').reset();
                document.getElementById('novo-ativo').checked = true;
                mostrarFormulario(false);
                carregarLaboratorio();
            }
        });

        window.editarLaboratorio = (id) => { idEmEdicao = id; carregarLaboratorio(); };
        window.cancelarEdicao = () => { idEmEdicao = null; carregarLaboratorio(); };

        window.salvarLaboratorio = async (laboratorioId) => {
            const titulo = document.getElementById(`edit-titulo-${laboratorioId}`).value.trim();
            const problema = document.getElementById(`edit-problema-${laboratorioId}`).value.trim();
            const instrucoes = document.getElementById(`edit-instrucoes-${laboratorioId}`).value.trim();
            const dificuldade = document.getElementById(`edit-dificuldade-${laboratorioId}`).value;
            const ativo = document.getElementById(`edit-ativo-${laboratorioId}`).checked;
            if (!titulo || !problema) return;

            const resultado = await chamarGerenciarLaboratorio('atualizar', { laboratorioId, titulo, problema, instrucoes, dificuldade, ativo });
            if (resultado) { idEmEdicao = null; carregarLaboratorio(); }
        };

        window.excluirLaboratorio = async (laboratorioId) => {
            if (!(await PibiexA11y.confirmar('Excluir este problema e todos os envios dos alunos? Essa ação não pode ser desfeita.'))) return;
            const resultado = await chamarGerenciarLaboratorio('excluir', { laboratorioId });
            if (resultado) carregarLaboratorio();
        };

        iniciarShellEquipe('laboratorio').then((sessao) => {
            if (!sessao) return;
            TOKEN_EQUIPE = sessao.token;
            carregarLaboratorio();
        });
    </script>
</body>
</html>
